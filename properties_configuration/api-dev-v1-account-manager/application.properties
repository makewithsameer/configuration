# =====================================================================================================
#  QuickNotify · account manager (logins, accounts, plans, admin console)
#  THE ONE PLACE for this service's settings: database, Aerospike, sign-in, codes, plans, logging...
#  Read at start-up (the service does not start without it) and again every 60 s: most changes apply
#  WITHOUT a restart. Keys marked (restart) are read only at start: ./deploy.sh restart account
#
#  PUBLIC REPO: secrets are NEVER written here. ${NAME} = filled from the server's deploy/.env when the
#  service starts (JWT_SECRET, INTERNAL_KEY, POSTGRES_PASSWORD).
#  Addresses (postgres, aerospike, notification) are the Docker service names from deploy/docker-compose.yml.
#  SQL statements (sql.* / jpa.*) and tunables (qn.tune.*): the sections at the end of this file.
# =====================================================================================================

# ---------------------------------------------------------------- service
server.port=8081
server.servlet.context-path=/account
server.forward-headers-strategy=framework
spring.http.converters.preferred-json-mapper=jackson2
spring.jackson2.default-property-inclusion=always
spring.jackson2.serialization.write-dates-as-timestamps=false
# the web app's address (links inside mails) - from deploy/.env PUBLIC_URL
app.public-url=${PUBLIC_URL:http://localhost:3000}
app.cors.allowed-origins=${PUBLIC_URL:http://localhost:3000}
# who people write to for help; empty = the first admin's email (applied live)
app.support-email=
# profile pictures (a Docker volume)
app.uploads-dir=/data/uploads

# ---------------------------------------------------------------- database: PostgreSQL (restart)
spring.datasource.url=jdbc:postgresql://postgres:5432/qn_accounts
spring.datasource.username=${POSTGRES_USER:quicknotify}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.pool-name=qn-accounts
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------- one-time codes: Aerospike with a TTL (restart)
app.otp.store=aerospike
app.otp.aerospike.hosts=aerospike:3000
app.otp.aerospike.namespace=quicknotify
app.otp.aerospike.set-prefix=qn_
app.otp.aerospike.connect-timeout=3s
app.otp.aerospike.operation-timeout=800ms
# codes (email / WhatsApp): length, how long they work, tries, how many per window (applied live)
app.otp.length=6
app.otp.ttl=10m
app.otp.max-attempts=5
app.otp.max-sends-per-window=5
app.otp.send-window=15m

# ---------------------------------------------------------------- login tokens + sign-in
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=quicknotify-account-manager
app.jwt.audience=quicknotify
# how long a login lasts (e.g. 12h, 7d), and an admin console login (applied live)
app.jwt.access-ttl=7d
app.jwt.admin-ttl=8h
# wrong passwords before an account is locked for a while (applied live)
app.login.max-failures=5
app.login.lock-for=15m
# Google sign-in (the client id is public: the browser sees it anyway)
app.google.client-id=348312835956-ef1kv79jqsjf18gt8j87h6jbehrtl94l.apps.googleusercontent.com
app.google.certs-url=https://www.googleapis.com/oauth2/v3/certs

# ---------------------------------------------------------------- the notification service (sends every mail)
app.notification-url=http://notification:8080/notification
app.internal-key=${INTERNAL_KEY}
# encrypts secrets an admin saves; empty = derived from JWT_SECRET
app.settings-key=${SETTINGS_KEY:}

# ---------------------------------------------------------------- plans
# DEV ONLY: paid plans switch on without a payment (invoices marked "test"). Keep false. (applied live)
app.billing.allow-without-payment=false

# ---------------------------------------------------------------- sign-in place (from the IP) + map in alert mails
app.geo.enabled=true
app.geo.lookup-url=https://ipapi.co/{ip}/json/
app.maps.enabled=true
app.maps.tile-url=https://tile.openstreetmap.org/{z}/{x}/{y}.png

# ---------------------------------------------------------------- logs (deploy/logs/account-manager)
# levels: TRACE, DEBUG, INFO, WARN, ERROR (applied live)
logging.level.root=INFO
logging.level.com.make.accountmanager=INFO
logging.level.org.hibernate.SQL=WARN
# a service call slower than this is logged as a WARN (restart)
app.logging.slow-call-ms=1000
# files: a new part every file-size, kept max-days (restart)
app.logs.dir=/app/logs
app.logs.file-size=10MB
app.logs.max-days=14
app.logs.total-cap=1GB

# ---------------------------------------------------------------- health + metrics (Prometheus / Grafana) (restart)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.metrics.tags.application=api-dev-v1-account-manager
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
# Admin -> System: how often the server checks everything (seconds); pause / resume / restart buttons (restart)
app.system.check-seconds=60
app.ops.restart-enabled=true

# ---------------------------------------------------------------- this file: read again every poll-seconds (restart)
app.config.poll-seconds=60
app.config.timeout-ms=5000

# =====================================================================================================
# Tunables (qn.tune.<area>.<name>): limits, timeouts, TTLs, batch sizes that used to be fixed in code.
# Read when the app starts (restart). The code keeps these same values as its fallback; a value that can't be
# read is ignored with a warning in the log. Durations: 1500ms / 90s / 15m / 2h / 7d. The start-up log lists
# the ones taken from here ("Tunable qn.tune.... = ... (config)").
# =====================================================================================================
# account-eraser
qn.tune.account-eraser.max-passes=5
# admin-team
qn.tune.admin-team.invite-life=72h
qn.tune.admin-team.max-invites-a-day=25
qn.tune.admin-team.max-tries=30
# admin
qn.tune.admin.max-page=100
# alert
qn.tune.alert.keep=90d
qn.tune.alert.max-per-hour=20
# checkout
qn.tune.checkout.max-orders-per-hour=12
qn.tune.checkout.poll-gap=3s
# client-error-controller
qn.tune.client-error-controller.limit-per-minute=20
qn.tune.client-error-controller.max-page=120
# cluster-ops
qn.tune.cluster-ops.back-wait=240s
qn.tune.cluster-ops.drain-wait=30s
# google-id-tokens
qn.tune.google-id-tokens.default-key-cache=1h
qn.tune.google-id-tokens.max-key-cache=24h
qn.tune.google-id-tokens.max-token-length=8192
qn.tune.google-id-tokens.min-key-cache=5m
qn.tune.google-id-tokens.unknown-key-refresh-gap=1m
# guest-tokens
qn.tune.guest-tokens.ttl=30d
# ip-locator
qn.tune.ip-locator.hit-ttl-ms=86400000
qn.tune.ip-locator.miss-ttl-ms=600000
# mail-settings-handover
qn.tune.mail-settings-handover.max-tries=20
qn.tune.mail-settings-handover.retry-seconds=30
# ops-switch
qn.tune.ops-switch.restart-delay=1500ms
# otp
qn.tune.otp.keep-after-expiry=10m
# password-reset
qn.tune.password-reset.grant-ttl=15m
qn.tune.password-reset.resend-cooldown=60s
# plan-cache
qn.tune.plan-cache.ttl-ms=30000
# platform-mailer
qn.tune.platform-mailer.alert-repeat-window-ms=600000
qn.tune.platform-mailer.location-wait-ms=25000
# restart-everything
qn.tune.restart-everything.gateway-wait=150s
qn.tune.restart-everything.single-wait=240s
qn.tune.restart-everything.step-wait=15m
# reverse-geocoder
qn.tune.reverse-geocoder.hit-ttl-ms=86400000
qn.tune.reverse-geocoder.min-gap-ms=1100
qn.tune.reverse-geocoder.miss-ttl-ms=600000
# scale
qn.tune.scale.agent-fresh=60s
qn.tune.scale.cool-backlog=20
qn.tune.scale.cool-cpu=25
qn.tune.scale.cool-minutes=10
qn.tune.scale.hot-backlog=300
qn.tune.scale.hot-cpu=70
qn.tune.scale.hot-seconds=40
qn.tune.scale.margin-mb=700
# security
qn.tune.security.backup-codes=10
# session-locations
qn.tune.session-locations.keep-ms=900000
# session
qn.tune.session.cache-ms=20000
# sign-in-history
qn.tune.sign-in-history.backfill-max=5000
qn.tune.sign-in-history.default-page=200
qn.tune.sign-in-history.location-wait-ms=25000
qn.tune.sign-in-history.max-page=500
# static-map-renderer
qn.tune.static-map-renderer.tile-ttl-ms=604800000
# support-assistant
qn.tune.support-assistant.min-score=2.2
# support-bus
qn.tune.support-bus.inline-max=7000
# support-files
qn.tune.support-files.max-bytes=5242880
# support-hub
qn.tune.support-hub.poll-alive-ms=25000
qn.tune.support-hub.remote-alive-ms=50000
qn.tune.support-hub.timeout-ms=1800000
qn.tune.support-hub.typing-ms=6000
# support-insights
qn.tune.support-insights.cache-ms=120000
# support
qn.tune.support.ai-answers-per-hour=40
qn.tune.support.email-every=10m
qn.tune.support.files-per-hour=20
qn.tune.support.guest-ai-per-hour-per-ip=30
qn.tune.support.guest-msgs-per-5min-per-ip=40
qn.tune.support.user-msgs-per-5min=30
# whats-app-codes
qn.tune.whats-app-codes.ttl-ms=30000

# =====================================================================================================
# SQL: every statement this service runs, by name (not in the Java code)
#   sql.<area>.<what>=...            run by code as Sql.q("<area>.<what>")
#   jpa.<Entity>.<method>=...        a repository method's query (JPQL; native SQL when the method says nativeQuery = true)
#   jpa.<Entity>.<method>.count=...  the count query of a paged method
# This file is also built into the jar (qn-config/application.properties), so a GitHub outage never breaks the
# queries. sql.* changes apply like the other settings (about a minute); jpa.* (repository) changes after a restart.
# Rules: values go in as ? / :name parameters, never into this text. {part} markers are filled by code from a fixed
# set (column names, ?-lists, filter lines), never from user input. A long statement continues on the next line
# with " \" at the end of the line. The unit test SqlCatalogTest fails when the code and this section disagree.
# =====================================================================================================
jpa.Account.findByPhoneEnding=select a from Account a where a.phone is not null and a.phone like concat('%', :last10) and a.status <> com.make.accountmanager.account.Account.Status.DELETED
jpa.Account.activeAdmins=select a from Account a where a.role = com.make.accountmanager.account.Account.Role.ADMIN and a.status = com.make.accountmanager.account.Account.Status.ACTIVE
jpa.Account.allAdmins=select a from Account a where a.role = com.make.accountmanager.account.Account.Role.ADMIN order by a.createdAt
jpa.Account.search=select a from Account a \
    where a.status <> com.make.accountmanager.account.Account.Status.DELETED \
    and a.role <> com.make.accountmanager.account.Account.Role.ADMIN \
    and (:type is null or a.type = :type) \
    and (:kind is null or a.businessKind = :kind) \
    and a.status in :statuses \
    and (:q = '' or lower(concat(coalesce(a.fullName,''),' ',a.email,' ',coalesce(a.companyName,''),' ',coalesce(a.organisation,''),' ',coalesce(a.city,''),' ',a.id)) like concat('%', :q, '%'))
jpa.Account.countByActorAndStatus=select a.type, a.businessKind, a.status, count(a) from Account a where a.status <> com.make.accountmanager.account.Account.Status.DELETED and a.role <> com.make.accountmanager.account.Account.Role.ADMIN group by a.type, a.businessKind, a.status

# ---------------------------------------------------------------- WorkspaceEventRepository
jpa.WorkspaceEvent.deleteOlderThan=delete from WorkspaceEvent e where e.createdAt < :cut

# ---------------------------------------------------------------- AccountEraser
sql.account-eraser.erase.delete-audit-event=delete from audit_event where actor_id = ?
sql.account-eraser.erase.delete-waitlist-entry=delete from waitlist_entry where lower(email) = lower(?)
sql.account-eraser.erase.delete-account=delete from account where id = ?
sql.account-eraser.account-tables=select c.table_name from information_schema.columns c join information_schema.tables t on t.table_name = c.table_name and t.table_schema = c.table_schema where c.table_schema = current_schema() and c.column_name = 'account_id' and t.table_type = 'BASE TABLE' order by c.table_name

# ---------------------------------------------------------------- AdminService
sql.admin-service.overview=select case when a.type = 'STUDENT' then 'student' when a.business_kind = 'COMPANY' then 'company' else 'business' end t, \
    count(*) total, \
    count(*) filter (where a.status <> 'DISABLED') active, \
    count(*) filter (where a.status = 'DISABLED') inactive, \
    count(*) filter (where a.created_at >= ?) new_in, \
    count(*) filter (where a.created_at >= ? and a.created_at < ?) new_prev, \
    count(*) filter (where a.last_login_at >= ?) seen7, \
    count(*) filter (where p.monthly > 0 and s.status = 'ACTIVE') paid, \
    count(*) filter (where a.email_verified or a.phone_verified) verified \
    from account a left join subscription s on s.account_id = a.id left join plan p on p.code = s.plan_code \
    where a.role <> 'ADMIN' and a.status <> 'DELETED' group by 1
sql.admin-service.overview-2=select (created_at at time zone 'Asia/Kolkata')::date d, \
    case when type = 'STUDENT' then 0 when business_kind = 'COMPANY' then 2 else 1 end k, count(*) n \
    from account where role <> 'ADMIN' and status <> 'DELETED' and created_at >= ? group by 1, 2

# ---------------------------------------------------------------- ClusterOps
sql.cluster-ops.create-table.ops-rollout=create table if not exists ops_rollout (service text primary key, by_email text, started_at text, nodes int not null default 0, done int not null default 0, now_node text, state text not null, finished_at text, updated_at timestamptz not null default now())
sql.cluster-ops.ready.update-ops-rollout=update ops_rollout set state = 'done', done = nodes, now_node = null, finished_at = ?, updated_at = now() where service = ? and state = 'running' and now_node = ?
sql.cluster-ops.finish-everything.update-ops-rollout=update ops_rollout set state = 'done', done = nodes, now_node = null, finished_at = ?, updated_at = now() where service = ? and state = 'running' and now_node = ? and not exists (select 1 from ops_rollout r where r.service = ? and r.state = 'running')
sql.cluster-ops.claim.insert-ops-rollout=insert into ops_rollout (service, by_email, started_at, nodes, done, now_node, state, finished_at, updated_at) values (?, ?, ?, ?, 0, null, 'running', null, now()) on conflict (service) do update set by_email = excluded.by_email, started_at = excluded.started_at, nodes = excluded.nodes, done = 0, now_node = null, state = 'running', finished_at = null, updated_at = now() where ops_rollout.state <> 'running' or ops_rollout.updated_at < now() - interval '10 minutes' returning service
sql.cluster-ops.put.update-ops-rollout=update ops_rollout set done = ?, now_node = ?, state = ?, finished_at = ?, updated_at = now() where service = ?
sql.cluster-ops.load=select * from ops_rollout where service = ?

# ---------------------------------------------------------------- ScaleService
sql.scale-service.create-table.ops-scale=create table if not exists ops_scale (service text primary key, mode text not null default 'auto', min_nodes int not null default 1, \
    max_nodes int not null default 2, fixed_nodes int not null default 2, desired int not null default 1, hot_since timestamptz, \
    cool_since timestamptz, changed_at timestamptz, surge_until timestamptz, surge_by text, wait_note text, wait_at timestamptz, \
    updated_by text, updated_at timestamptz not null default now())
sql.scale-service.create-table.ops-scale-event=create table if not exists ops_scale_event (id bigserial primary key, at timestamptz not null default now(), service text not null, \
    from_nodes int, to_nodes int, kind text not null, why text, by_who text)
sql.scale-service.create-index.ix-ops-scale-event-at=create index if not exists ix_ops_scale_event_at on ops_scale_event(at desc)
sql.scale-service.create-table.ops-host=create table if not exists ops_host (id int primary key, report text not null, reported_at timestamptz not null default now(), via text)
sql.scale-service.create-table.ops-host-cmd=create table if not exists ops_host_cmd (id bigserial primary key, cmd text not null, by_who text, created_at timestamptz not null default now(), \
    taken_at timestamptz, done_at timestamptz, result text)
sql.scale-service.ready.insert-ops-scale=insert into ops_scale(service, desired, updated_by) values (?, 1, 'default') on conflict (service) do nothing
sql.scale-service.ready.delete-ops-scale-event=delete from ops_scale_event where at < now() - interval '30 days'
sql.scale-service.agent-report.insert-ops-host=insert into ops_host(id, report, reported_at, via) values (1, ?, now(), ?) on conflict (id) do update set report = excluded.report, reported_at = now(), via = excluded.via
sql.scale-service.agent-report.update-ops-host-cmd=update ops_host_cmd set done_at = now(), result = ? where id = ? and done_at is null
sql.scale-service.agent-report.update-ops-host-cmd-2=update ops_host_cmd set taken_at = now() where id in (select id from ops_host_cmd where taken_at is null and created_at > now() - interval '10 minutes' order by id limit 3) returning id, cmd
sql.scale-service.decide=select *, now() as db_now from ops_scale where service = ? for update
sql.scale-service.decide.update-ops-scale=update ops_scale set wait_note = ?, wait_at = now() where service = ?
sql.scale-service.decide.update-ops-scale-2=update ops_scale set wait_note = null, wait_at = null where service = ?
sql.scale-service.decide.update-ops-scale-3=update ops_scale set desired = ?, changed_at = now(), hot_since = ?, cool_since = ? where service = ?
sql.scale-service.decide.update-ops-scale-4=update ops_scale set hot_since = ?, cool_since = ? where service = ?
sql.scale-service.set-policy.update-ops-scale=update ops_scale set mode = ?, min_nodes = ?, max_nodes = ?, fixed_nodes = ?, hot_since = null, cool_since = null, updated_by = ?, updated_at = now() where service = ?
sql.scale-service.policy=select * from ops_scale where service = ?
sql.scale-service.agent-alive=select reported_at from ops_host where id = 1
sql.scale-service.queue-command.insert-ops-host-cmd=insert into ops_host_cmd(cmd, by_who) values (?, ?) returning id
sql.scale-service.command=select id, cmd, by_who, created_at, taken_at, done_at, result from ops_host_cmd where id = ?
sql.scale-service.view=select reported_at from ops_host where id = 1
sql.scale-service.view-2=select mode, min_nodes, max_nodes, fixed_nodes, desired, surge_until, surge_by, wait_note, hot_since, cool_since, updated_by, updated_at from ops_scale where service = ?
sql.scale-service.view-3=select id, at, service, from_nodes, to_nodes, kind, why, by_who from ops_scale_event order by id desc limit 30
sql.scale-service.view-4=select id, cmd, by_who, created_at, taken_at, done_at, result from ops_host_cmd order by id desc limit 5
sql.scale-service.report=select report from ops_host where id = 1
sql.scale-service.event.insert-ops-scale-event=insert into ops_scale_event(service, from_nodes, to_nodes, kind, why, by_who) values (?, ?, ?, ?, ?, ?)

# ---------------------------------------------------------------- AlertEventRepository
jpa.AlertEvent.countsSince=select e.kind, e.status, count(e) from AlertEvent e where e.at >= :since group by e.kind, e.status
jpa.AlertEvent.lastSent=select e.kind, max(e.at) from AlertEvent e where e.status = com.make.accountmanager.alert.AlertEvent.Status.SENT group by e.kind
jpa.AlertEvent.search=select e from AlertEvent e \
    where (:kind is null or e.kind = :kind) and (:status is null or e.status = :status) \
    order by e.at desc

# ---------------------------------------------------------------- AnnouncementRepository
jpa.Announcement.findLiveAt=select a from Announcement a where (a.startsAt is null or a.startsAt <= :now) and (a.endsAt is null or a.endsAt > :now) order by a.createdAt desc

# ---------------------------------------------------------------- AuditEventRepository
jpa.AuditEvent.search=select e from AuditEvent e \
    where (:action = '' or e.action = :action) \
    and (:q = '' or lower(concat(coalesce(e.target,''),' ',coalesce(e.detail,''),' ',coalesce(e.actorName,''))) like concat('%', :q, '%')) \
    order by e.at desc

# ---------------------------------------------------------------- PasswordResetGrantRepository
jpa.PasswordResetGrant.claim=update PasswordResetGrant g set g.usedAt = :now where g.id = :id and g.usedAt is null and g.expiresAt > :now
jpa.PasswordResetGrant.retireAll=update PasswordResetGrant g set g.usedAt = :now where g.accountId = :accountId and g.usedAt is null
jpa.PasswordResetGrant.deleteExpiredBefore=delete from PasswordResetGrant g where g.expiresAt < :before

# ---------------------------------------------------------------- AccountAvatarRepository
jpa.AccountAvatar.deleteByAccount=delete from AccountAvatar a where a.accountId = :accountId

# ---------------------------------------------------------------- EnumCheckRepair
sql.enum-check-repair.repair=select pg_get_constraintdef(oid) from pg_constraint where conname = ? and conrelid = to_regclass(?)

# ---------------------------------------------------------------- HealthService
sql.health-service.full=select count(*) from account where status <> 'DELETED' and role <> 'ADMIN'
sql.health-service.full-2=select count(*) from login_session where revoked_at is null and expires_at > now()

# ---------------------------------------------------------------- PaymentOrderRepository
jpa.PaymentOrder.lockById=select o from PaymentOrder o where o.id = :id

# ---------------------------------------------------------------- PlanAdminService
sql.plan-admin-service.never-used=select (select count(*) from subscription where plan_code = :c) + (select count(*) from subscription_period where plan_code = :c) \
    + (select count(*) from payment_order where plan_code = :c)

# ---------------------------------------------------------------- SubscriptionRepository
jpa.Subscription.withoutHistory=select s from Subscription s where not exists (select 1 from SubscriptionPeriod p where p.accountId = s.accountId)
jpa.Subscription.liveCountsByPlan=select s.plan_code, count(*) from subscription s join account a on a.id = s.account_id \
    where s.status in ('ACTIVE', 'TRIALING') and (s.renews_at is null or s.renews_at > now()) \
    and a.role <> 'ADMIN' and a.status <> 'DELETED' \
    group by s.plan_code

# ---------------------------------------------------------------- LoginSessionRepository
jpa.LoginSession.withoutSignInEvent=select s from LoginSession s where s.createdAt is not null and not exists (select 1 from SignInEvent e where e.sessionId = s.id) order by s.createdAt
jpa.LoginSession.revokeAll=update LoginSession s set s.revokedAt = :now, s.revokedReason = :why where s.accountId = :acc and s.revokedAt is null and (:keep is null or s.id <> :keep)

# ---------------------------------------------------------------- SignInEventRepository
jpa.SignInEvent.deleteOlderThan=delete from SignInEvent e where e.at < :before

# ---------------------------------------------------------------- SupportBus
sql.support-bus.publish.insert-support-bus-msg=insert into support_bus_msg (payload) values (?) returning id
sql.support-bus.publish.delete-support-bus-msg=delete from support_bus_msg where at < now() - interval '5 minutes'
sql.support-bus.create-table.support-bus-msg=create table if not exists support_bus_msg (id bigserial primary key, payload text not null, at timestamptz not null default now())
sql.support-bus.handle=select payload from support_bus_msg where id = ?

# ---------------------------------------------------------------- SupportConversationRepository
jpa.SupportConversation.inbox=select c from SupportConversation c where c.status in :statuses and (:q is null or lower(c.accountName) like :q or lower(c.accountEmail) like :q or lower(c.topic) like :q) order by case when c.status = com.make.accountmanager.support.SupportConversation.Status.WAITING then 0 else 1 end, c.lastMessageAt desc
jpa.SupportConversation.firstReplies=select c.waitingSince, min(m.at) from SupportConversation c, SupportMessage m where m.conversationId = c.id and m.sender = com.make.accountmanager.support.SupportMessage.Sender.ADMIN and c.waitingSince >= :from and m.at >= c.waitingSince group by c.id, c.waitingSince
jpa.SupportConversation.closedStats=select count(c), sum(case when c.waitingSince is null then 1 else 0 end), sum(case when c.rating = 1 then 1 else 0 end), sum(case when c.rating = -1 then 1 else 0 end) from SupportConversation c where c.closedAt >= :from
jpa.SupportConversation.unreadForAdmins=select coalesce(sum(c.unreadAdmin), 0) from SupportConversation c where c.status in (com.make.accountmanager.support.SupportConversation.Status.WAITING, com.make.accountmanager.support.SupportConversation.Status.LIVE)
jpa.SupportConversation.touch=update SupportConversation c set c.lastMessageAt = :at, c.lastPreview = :preview, c.lastSender = :sender, c.unreadAdmin = c.unreadAdmin + :forAdmin, c.unreadUser = c.unreadUser + :forUser, c.botAnswers = c.botAnswers + :bot where c.id = :id
jpa.SupportConversation.readByAdmin=update SupportConversation c set c.unreadAdmin = 0 where c.id = :id and c.unreadAdmin > 0
jpa.SupportConversation.readByUser=update SupportConversation c set c.unreadUser = 0 where c.id = :id and c.unreadUser > 0
jpa.SupportConversation.claimEmail=update SupportConversation c set c.emailedAt = :now where c.id = :id and (c.emailedAt is null or c.emailedAt < :since)
jpa.SupportConversation.closeIdle=update SupportConversation c set c.status = com.make.accountmanager.support.SupportConversation.Status.CLOSED, c.closedAt = :now where (c.status = com.make.accountmanager.support.SupportConversation.Status.BOT and c.lastMessageAt < :botBefore) or (c.status in (com.make.accountmanager.support.SupportConversation.Status.WAITING, com.make.accountmanager.support.SupportConversation.Status.LIVE) and c.lastMessageAt < :humanBefore)

# ---------------------------------------------------------------- statements with {parts} (names chosen by code, never user input)
# AccountEraser: one table that holds the account's rows ({table}: a quoted table name read from the database)
sql.account-eraser.erase.delete-account-rows=delete from {table} where account_id = ?
# ScaleService: the one-extra-node "surge" during a restart, on for 15 minutes / off
sql.scale-service.surge.on=update ops_scale set surge_until = now() + interval '15 minutes', surge_by = ? where service = ?
sql.scale-service.surge.off=update ops_scale set surge_until = null, surge_by = ? where service = ?
# EnumCheckRepair: keep a status column's check constraint in step with the Java enum
sql.enum-check-repair.drop-check=alter table {table} drop constraint if exists {constraint}
sql.enum-check-repair.add-check=alter table {table} add constraint {constraint} check ({column} is null or {column} in ({allowed}))
# health pings and the support chat's live channel (PostgreSQL LISTEN/NOTIFY)
sql.system-monitor.ping=select 1
sql.health-service.ping=select 1
sql.support-bus.notify=select pg_notify(?, ?)
# ClusterLeader: one node runs the background jobs, chosen by a PostgreSQL advisory lock ({key}: a number from code)
sql.cluster-leader.ping=select 1
sql.cluster-leader.try-lock=select pg_try_advisory_lock({key})
sql.cluster-leader.unlock=select pg_advisory_unlock({key})
# SupportBus: listen for support chat messages from other nodes ({channel}: a fixed name from code)
sql.support-bus.listen=LISTEN {channel}
