# QuickNotify · account manager
# Read at every start of the service. Change → commit → push → ./deploy.sh restart account
# PUBLIC REPO: no secrets here (JWT secret, keys, passwords stay in deploy/.env on the server).

# --- how much gets logged: TRACE, DEBUG, INFO, WARN, ERROR
logging.level.root=INFO
logging.level.com.make=INFO

# --- how long a login lasts (e.g. 12h, 7d)
app.jwt.access-ttl=7d

# --- one-time codes (email / WhatsApp): length, how long they work, tries, how many per window
app.otp.length=6
app.otp.ttl=10m
app.otp.max-attempts=5
app.otp.max-sends-per-window=5
app.otp.send-window=15m

# --- wrong passwords before an account is locked for a while
app.login.max-failures=5
app.login.lock-for=15m

# --- sign-in place (from the IP) and the small map in sign-in alert mails
app.geo.enabled=true
