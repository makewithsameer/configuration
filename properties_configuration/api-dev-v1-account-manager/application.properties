# =====================================================================================================
#  QuickNotify · account manager (logins, accounts, plans, admin console)
#  THE ONE PLACE for this service's settings: database, Aerospike, sign-in, codes, plans, logging...
#  Read at start-up (the service does not start without it) and again every 60 s: most changes apply
#  WITHOUT a restart. Keys marked (restart) are read only at start: ./deploy.sh restart account
#
#  PUBLIC REPO: secrets are NEVER written here. ${NAME} = filled from the server's deploy/.env when the
#  service starts (JWT_SECRET, INTERNAL_KEY, POSTGRES_PASSWORD).
#  Addresses (postgres, aerospike, notification) are the Docker service names from deploy/docker-compose.yml.
# =====================================================================================================

# ---------------------------------------------------------------- service
server.port=8081
server.servlet.context-path=/account
server.forward-headers-strategy=framework
spring.http.converters.preferred-json-mapper=jackson2
spring.jackson2.default-property-inclusion=always
spring.jackson2.serialization.write-dates-as-timestamps=false
# the web app's address (links inside mails) - from deploy/.env PUBLIC_URL
app.public-url=${PUBLIC_URL:http://localhost:3000}
app.cors.allowed-origins=${PUBLIC_URL:http://localhost:3000}
# who people write to for help; empty = the first admin's email (applied live)
app.support-email=
# profile pictures (a Docker volume)
app.uploads-dir=/data/uploads

# ---------------------------------------------------------------- database: PostgreSQL (restart)
spring.datasource.url=jdbc:postgresql://postgres:5432/qn_accounts
spring.datasource.username=${POSTGRES_USER:quicknotify}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.pool-name=qn-accounts
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------- one-time codes: Aerospike with a TTL (restart)
app.otp.store=aerospike
app.otp.aerospike.hosts=aerospike:3000
app.otp.aerospike.namespace=quicknotify
app.otp.aerospike.set-prefix=qn_
app.otp.aerospike.connect-timeout=3s
app.otp.aerospike.operation-timeout=800ms
# codes (email / WhatsApp): length, how long they work, tries, how many per window (applied live)
app.otp.length=6
app.otp.ttl=10m
app.otp.max-attempts=5
app.otp.max-sends-per-window=5
app.otp.send-window=15m
# DEV ONLY: show codes in the API answer and the log. Keep false.
app.otp.dev-echo=false

# ---------------------------------------------------------------- login tokens + sign-in
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=quicknotify-account-manager
app.jwt.audience=quicknotify
# how long a login lasts (e.g. 12h, 7d), and an admin console login (applied live)
app.jwt.access-ttl=7d
app.jwt.admin-ttl=8h
# wrong passwords before an account is locked for a while (applied live)
app.login.max-failures=5
app.login.lock-for=15m
# Google sign-in (the client id is public: the browser sees it anyway)
app.google.client-id=348312835956-ef1kv79jqsjf18gt8j87h6jbehrtl94l.apps.googleusercontent.com
app.google.certs-url=https://www.googleapis.com/oauth2/v3/certs

# ---------------------------------------------------------------- the notification service (sends every mail)
app.notification-url=http://notification:8080/notification
app.internal-key=${INTERNAL_KEY}
# encrypts secrets an admin saves; empty = derived from JWT_SECRET
app.settings-key=${SETTINGS_KEY:}

# ---------------------------------------------------------------- plans
# DEV ONLY: paid plans switch on without a payment (invoices marked "test"). Keep false. (applied live)
app.billing.allow-without-payment=false

# ---------------------------------------------------------------- sign-in place (from the IP) + map in alert mails
app.geo.enabled=true
app.geo.lookup-url=https://ipapi.co/{ip}/json/
app.maps.enabled=true
app.maps.tile-url=https://tile.openstreetmap.org/{z}/{x}/{y}.png

# ---------------------------------------------------------------- logs (deploy/logs/account-manager)
# levels: TRACE, DEBUG, INFO, WARN, ERROR (applied live)
logging.level.root=INFO
logging.level.com.make.accountmanager=INFO
logging.level.org.hibernate.SQL=WARN
# a service call slower than this is logged as a WARN (restart)
app.logging.slow-call-ms=1000
# files: a new part every file-size, kept max-days (restart)
app.logs.dir=/app/logs
app.logs.file-size=10MB
app.logs.max-days=14
app.logs.total-cap=1GB

# ---------------------------------------------------------------- health + metrics (Prometheus / Grafana) (restart)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.metrics.tags.application=api-dev-v1-account-manager
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
# Admin -> System: how often the server checks everything (seconds); pause / resume / restart buttons (restart)
app.system.check-seconds=60
app.ops.restart-enabled=true

# ---------------------------------------------------------------- this file: read again every poll-seconds (restart)
app.config.poll-seconds=60
app.config.timeout-ms=5000
