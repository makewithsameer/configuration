# =====================================================================================================
#  QuickNotify · account manager (logins, accounts, plans, admin console)
#  Read at start-up AND every 60 seconds after. Commit + push → applied in about a minute, NO restart
#  (Admin → System → "Reload settings now" reads it at once; GitHub can serve the old file for ~5 min).
#  Order: environment (deploy/.env, deploy/config/*.env) > this file > the built-in application.yml.
#  PUBLIC REPO: no secrets here. JWT secret, keys, passwords, database stay in deploy/.env on the server.
#  Keys marked (restart) are read once at start: change them, then ./deploy.sh restart account
# =====================================================================================================

# --- how much gets logged: TRACE, DEBUG, INFO, WARN, ERROR (applied live)
logging.level.root=INFO
logging.level.com.make.accountmanager=INFO
logging.level.org.hibernate.SQL=WARN
# a service call slower than this is logged as a WARN (restart)
app.logging.slow-call-ms=1000

# --- who people write to for help; empty = the first admin's email
app.support-email=

# --- how long a login lasts (e.g. 12h, 7d), and an admin console login
app.jwt.access-ttl=7d
app.jwt.admin-ttl=8h

# --- one-time codes (email / WhatsApp): length, how long they work, tries, how many per window
app.otp.length=6
app.otp.ttl=10m
app.otp.max-attempts=5
app.otp.max-sends-per-window=5
app.otp.send-window=15m

# --- wrong passwords before an account is locked for a while
app.login.max-failures=5
app.login.lock-for=15m

# --- sign-in place (from the IP) and the small map in sign-in alert mails
app.geo.enabled=true
app.geo.lookup-url=https://ipapi.co/{ip}/json/
app.maps.enabled=true
app.maps.tile-url=https://tile.openstreetmap.org/{z}/{x}/{y}.png

# --- Admin → System: how often the server checks every service (seconds) (restart)
app.system.check-seconds=60
# --- how often this file is read again (seconds) (restart)
app.config.poll-seconds=60
app.config.timeout-ms=5000

# --- log files (deploy/logs/account-manager): a new part every file-size, kept max-days (restart)
app.logs.file-size=10MB
app.logs.max-days=14
app.logs.total-cap=1GB
