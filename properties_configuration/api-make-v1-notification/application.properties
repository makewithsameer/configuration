# QuickNotify · notification service
# Read at every start of the service. Change → commit → push → ./deploy.sh restart notification
# PUBLIC REPO: no secrets here (DB password, keys, tokens stay in deploy/.env on the server).

# --- how much gets logged: TRACE, DEBUG, INFO, WARN, ERROR
logging.level.root=INFO
logging.level.com.make=INFO

# --- job seekers: mails per day when the plan doesn't say, group sizes
student.daily-limit=40
student.max-group-size=10
student.max-groups=20

# --- providers a paid plan may have when the plan itself doesn't say (free plan / trial: always 1)
app.providers.paid-limit=25

# --- "Get started" test mails: how many one account may send in a window
app.onboarding.test-mail.per-window=5
app.onboarding.test-mail.window-minutes=10
