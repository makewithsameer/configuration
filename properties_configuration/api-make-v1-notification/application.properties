# =====================================================================================================
#  QuickNotify · notification service (mails, campaigns, contacts, templates, automations, scheduler)
#  THE ONE PLACE for this service's settings: database, Kafka, Elasticsearch, EMQX, limits, logging...
#  Read at start-up (the service does not start without it) and again every 60 s: most changes apply
#  WITHOUT a restart. Keys marked (restart) are read only at start: ./deploy.sh restart notification
#
#  PUBLIC REPO: secrets are NEVER written here. ${NAME} = filled from the server's deploy/.env or
#  deploy/config/notification.env when the service starts (JWT_SECRET, POSTGRES_PASSWORD, keys, tokens).
#  Addresses (postgres, kafka, ...) are the Docker service names from deploy/docker-compose.yml.
#  SQL statements (sql.* / jpa.*) and tunables (qn.tune.*): the sections at the end of this file.
# =====================================================================================================

# ---------------------------------------------------------------- service
server.port=8080
server.servlet.context-path=/notification
spring.main.allow-circular-references=true
spring.http.converters.preferred-json-mapper=jackson2
spring.output.ansi.enabled=never
# the web app's address (links inside mails, open-tracking images) - from deploy/.env PUBLIC_URL
app.public-url=${PUBLIC_URL:http://localhost:3000}
cors.allowed-origins=${PUBLIC_URL:http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ---------------------------------------------------------------- database: PostgreSQL (restart)
spring.datasource.url=jdbc:postgresql://postgres:5432/qn_notification
spring.datasource.username=${POSTGRES_USER:quicknotify}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=HikariPool-Notification
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------- Kafka (restart)
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.topic.name=notification
kafka.retry.max-attempts=3
kafka.retry.delay=1000

# ---------------------------------------------------------------- Elasticsearch: delivery logs + search (restart)
elasticsearch.enabled=true
elasticsearch.nodes=elasticsearch:9200
elasticsearch.scheme=http
elasticsearch.auth.enabled=false
elasticsearch.keep-alive-ms=30000
elasticsearch.index.name=notification-logs
notification.logging.db.enabled=true
notification.logging.elastic.enabled=true

# ---------------------------------------------------------------- EMQX / MQTT push (only with the "mqtt" profile) (restart)
emqx.broker.url=tcp://emqx:1883
emqx.auth.enabled=true

# ---------------------------------------------------------------- login tokens (made by the account manager, checked here)
jwt.secret=${JWT_SECRET}
jwt.issuer=quicknotify-account-manager
jwt.audience=quicknotify
# the account manager: session checks + the internal key both services share
app.account-manager.url=http://account-manager:8081/account
app.account-manager.internal-key=${INTERNAL_KEY}
app.auth.session-check=true
app.auth.session-check-ttl-ms=20000
app.auth.session-check-fail-closed=false
app.auth.user-paths=/api/v1/student/*,/api/v1/notifications,/api/v1/notifications/*,/api/v1/me/*,/api/v1/onboarding,/api/v1/onboarding/*,/api/v1/admin/*,/api/v1/biz/*
app.auth.public-paths=/api/v1/student/t/,/api/v1/biz/t/
app.legacy-api.enabled=false
tenant.ignore.paths=/api/v1/health
management.health.redis.enabled=false

# ---------------------------------------------------------------- delivery providers
# providers a paid plan may have when the plan itself doesn't say (applied live)
app.providers.paid-limit=25
# WhatsApp sign-in codes (Meta WhatsApp Cloud API). Number id + token come from deploy/config/notification.env
app.providers.platform-whatsapp.phone-number-id=${PLATFORM_WHATSAPP_PHONE_NUMBER_ID:}
app.providers.platform-whatsapp.access-token=${PLATFORM_WHATSAPP_ACCESS_TOKEN:}
app.providers.platform-whatsapp.display-number=${PLATFORM_WHATSAPP_DISPLAY_NUMBER:}
app.providers.platform-whatsapp.otp-template=quicknotify_login_code
app.providers.platform-whatsapp.template-language=en
app.providers.platform-whatsapp.api-base=https://graph.facebook.com/v21.0/
app.providers.platform-whatsapp.verify-on-start=true

# ---------------------------------------------------------------- job seekers (Gmail sending)
# encrypts saved Gmail app passwords (deploy/config/notification.env). NEVER change it after the first start.
student.crypto-key=${STUDENT_CRYPTO_KEY}
student.public-base-url=${PUBLIC_URL:http://localhost:3000}/notification
student.attachments-dir=/data/attachments
student.daily-limit=40
student.max-groups=20
student.max-group-size=10
student.max-attachment-bytes=10485760
# scheduled mails: how often the scheduler looks (ms), how many per round, tries (restart)
student.scheduler.delay-ms=30000
student.scheduler.batch-size=20
student.scheduler.lock-seconds=300
student.scheduler.max-attempts=3
# "Get started" test mail: how many one account may send per window (applied live)
app.onboarding.test-mail.per-window=5
app.onboarding.test-mail.window-minutes=10

# ---------------------------------------------------------------- business sending (restart)
biz.worker.delay-ms=1000
biz.worker.initial-delay-ms=1000
biz.worker.batch=100
biz.worker.max-attempts=4
biz.worker.threads=12
biz.campaigns.check-ms=20000
biz.campaigns.initial-delay-ms=20000
biz.automations.tick-ms=5000
biz.automations.initial-delay-ms=20000
# cost per message shown in analytics (paise)
biz.cost.email-paise=0
biz.cost.sms-paise=18
biz.cost.whatsapp-paise=35
biz.cost.push-paise=0
app.template-library.load-on-start=true
file.upload.max-size=50MB
file.upload.max-request-size=50MB

# ---------------------------------------------------------------- logs (deploy/logs/notification)
# levels: TRACE, DEBUG, INFO, WARN, ERROR (applied live)
logging.level.root=INFO
logging.level.com.make.application=INFO
logging.level.org.hibernate.SQL=WARN
# a service call slower than this is logged as a WARN (restart)
app.logging.slow-call-ms=1000
# files: a new part every file-size, kept max-days (restart)
app.logs.dir=/app/logs
app.logs.file-size=10MB
app.logs.max-days=14
app.logs.total-cap=1GB

# ---------------------------------------------------------------- health + metrics (Prometheus / Grafana) (restart)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=api-make-v1-notification
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
# Admin -> System: pause / resume / restart from the console
app.ops.restart-enabled=true

# ---------------------------------------------------------------- this file: read again every poll-seconds (restart)
app.config.poll-seconds=60
app.config.timeout-ms=5000

# =====================================================================================================
# Tunables (qn.tune.<area>.<name>): limits, timeouts, TTLs, batch sizes that used to be fixed in code.
# Read when the app starts (restart). The code keeps these same values as its fallback; a value that can't be
# read is ignored with a warning in the log. Durations: 1500ms / 90s / 15m / 2h / 7d. The start-up log lists
# the ones taken from here ("Tunable qn.tune.... = ... (config)").
# =====================================================================================================
# account-client
qn.tune.account-client.stale-max-ms=600000
qn.tune.account-client.ttl-ms=60000
# automation-engine
qn.tune.automation-engine.max-steps-per-tick=50
# biz-analytics
qn.tune.biz-analytics.min-delivered-for-insights=50
# biz-constants
qn.tune.biz-constants.batch=1000
qn.tune.biz-constants.default-page-size=50
qn.tune.biz-constants.max-group-size=100000
qn.tune.biz-constants.max-groups=200
qn.tune.biz-constants.max-import-rows=100000
qn.tune.biz-constants.max-page-size=200
qn.tune.biz-constants.max-typed-recipients=5000
qn.tune.biz-constants.report-sample=200
# biz-engagement
qn.tune.biz-engagement.cache-ms=120000
qn.tune.biz-engagement.max-contacts=300000
# biz-logs
qn.tune.biz-logs.max-retry-batch=500
qn.tune.biz-logs.retry-inline=5
# biz-plan-quota
qn.tune.biz-plan-quota.cache-ms=15000
# company-account
qn.tune.company-account.trial-days-fallback=7
# contact-import-jobs
qn.tune.contact-import-jobs.batch=2000
qn.tune.contact-import-jobs.max-bytes=83886080
qn.tune.contact-import-jobs.max-errors=200
qn.tune.contact-import-jobs.max-rows=1000000
# contact
qn.tune.contact.max-chunk=1000
qn.tune.contact.max-errors=200
qn.tune.contact.max-file-rows=1000000
qn.tune.contact.max-page=10000
# delivery-call-logger
qn.tune.delivery-call-logger.slow-ms=5000
# delivery-worker
qn.tune.delivery-worker.route-ttl-ms=20000
# doc-store
qn.tune.doc-store.max-bytes=600000
# hr-radar
qn.tune.hr-radar.cache-ms=300000
qn.tune.hr-radar.cache-size=20000
qn.tune.hr-radar.max-senders=16
qn.tune.hr-radar.prefetch-seconds=120
# http
qn.tune.http.slow-ms=5000
# hunt-insights
qn.tune.hunt-insights.min-group=3
qn.tune.hunt-insights.min-sample=5
# inbox
qn.tune.inbox.max-page=100
# interview
qn.tune.interview.bank-limit=300
qn.tune.interview.debrief-days=30
qn.tune.interview.max-questions=25
# job-autopilot
qn.tune.job-autopilot.default-cap=8
qn.tune.job-autopilot.default-min=60
qn.tune.job-autopilot.fresh-days=3
qn.tune.job-autopilot.max-attach=3
qn.tune.job-autopilot.max-cap=25
qn.tune.job-autopilot.max-delay-hours=72
qn.tune.job-autopilot.max-exclude=50
qn.tune.job-autopilot.max-no-contact-per-run=40
qn.tune.job-autopilot.min-min=40
qn.tune.job-autopilot.run-every-min=20
qn.tune.job-autopilot.same-company-days=14
qn.tune.job-autopilot.same-person-days=30
# job-hunt
qn.tune.job-hunt.debrief-nudge-days=3
qn.tune.job-hunt.default-follow-up-days=5
qn.tune.job-hunt.default-target=15
qn.tune.job-hunt.ghost-days=14
qn.tune.job-hunt.max-follow-ups=2
qn.tune.job-hunt.max-prep=12
qn.tune.job-hunt.thank-days=7
# job-radar
qn.tune.job-radar.fetch-batch=25
qn.tune.job-radar.ghost-days=60
qn.tune.job-radar.inbox-first-days=14
qn.tune.job-radar.keep-days=90
qn.tune.job-radar.max-alert-mails=150
qn.tune.job-radar.max-follows=60
qn.tune.job-radar.max-history=12
qn.tune.job-radar.max-pasted=300
qn.tune.job-radar.max-recent=8
qn.tune.job-radar.max-rows=6000
qn.tune.job-radar.max-sources=2000
qn.tune.job-radar.max-student-sources-day=15
qn.tune.job-radar.page=30
qn.tune.job-radar.scan-attempts=2
qn.tune.job-radar.scan-stale-sec=75
qn.tune.job-radar.stale-days=45
# mail
qn.tune.mail.max-batch=500
# mailbox
qn.tune.mailbox.gmail-daily-cap=500
# ops-switch
qn.tune.ops-switch.restart-delay=1500ms
# owner-data-eraser
qn.tune.owner-data-eraser.max-passes=5
# platform-mail-settings
qn.tune.platform-mail-settings.socket-timeout-ms=8000
# public-api
qn.tune.public-api.max-batch=1000
# pulse-public-controller
qn.tune.pulse-public-controller.per-minute=120
# pulse
qn.tune.pulse.link-cache-ms=60000
qn.tune.pulse.max-beat-seconds=15
qn.tune.pulse.max-resume-bytes=10485760
qn.tune.pulse.max-session-seconds=1800
qn.tune.pulse.max-sessions-per-hour=40
qn.tune.pulse.reading-now-seconds=25
# qn-bus
qn.tune.qn-bus.open-ms=30000
# qn-outbox
qn.tune.qn-outbox.claim=100
qn.tune.qn-outbox.max-local-tries=6
# qn-queues
qn.tune.qn-queues.cache-ms=5000
# session-guard
qn.tune.session-guard.dead-session-memory-ms=21600000
qn.tune.session-guard.max-remembered-sessions=50000
# student-file-controller
qn.tune.student-file-controller.max-read-bytes=10485761
# student-mail-scheduler
qn.tune.student-mail-scheduler.alarm-late-ms=150
qn.tune.student-mail-scheduler.max-alarm-ahead-ms=21600000
# student-plan-limits
qn.tune.student-plan-limits.plans-ttl-ms=60000
# template-store
qn.tune.template-store.max-document-chars=400000

# =====================================================================================================
# SQL: every statement this service runs, by name (not in the Java code)
#   sql.<area>.<what>=...            run by code as Sql.q("<area>.<what>")
#   jpa.<Entity>.<method>=...        a repository method's query (JPQL; native SQL when the method says nativeQuery = true)
#   jpa.<Entity>.<method>.count=...  the count query of a paged method
# This file is also built into the jar (qn-config/application.properties), so a GitHub outage never breaks the
# queries. sql.* changes apply like the other settings (about a minute); jpa.* (repository) changes after a restart.
# Rules: values go in as ? / :name parameters, never into this text. {part} markers are filled by code from a fixed
# set (column names, ?-lists, filter lines), never from user input. A long statement continues on the next line
# with " \" at the end of the line. The unit test SqlCatalogTest fails when the code and this section disagree.
# =====================================================================================================
jpa.WorkspaceEvent.deleteOlderThan=delete from WorkspaceEvent e where e.createdAt < :cut

# ---------------------------------------------------------------- BizAnalyticsService
sql.biz-analytics-service.source-meta=select source_id, max(source_name), max(source), max(channel), min(created_at) from biz_message where owner_id = :o and created_at >= :f and created_at < :t and env = 'live' and source in ('campaign','automation') and source_id is not null group by 1

# ---------------------------------------------------------------- BizConversionRepository
jpa.BizConversion.spentPaise=select coalesce(sum(c.amountPaise), 0) from BizConversion c where c.ownerId = :owner and c.contactId = :contact
jpa.BizConversion.daily=select cast(date_trunc('day', at at time zone 'Asia/Kolkata') as date), channel, source_id, count(*), coalesce(sum(amount_paise),0) from biz_conversion where owner_id = :owner and at >= :from and at < :to group by 1, 2, 3

# ---------------------------------------------------------------- BizFlowRunRepository
jpa.BizFlowRun.due=select r.id from BizFlowRun r where r.status = 'active' and r.nextAt <= :now order by r.nextAt asc
jpa.BizFlowRun.statusCounts=select r.status, count(r) from BizFlowRun r where r.flowId = :flow group by r.status
jpa.BizFlowRun.outcomes=select r.outcome, count(r) from BizFlowRun r where r.flowId = :flow and r.outcome is not null group by r.outcome
jpa.BizFlowRun.enteredDaily=select cast(date_trunc('day', entered_at at time zone 'Asia/Kolkata') as date), count(*) from biz_flow_run where flow_id = :flow and entered_at >= :from group by 1
jpa.BizFlowRun.stopAll=update BizFlowRun r set r.status = 'exited', r.outcome = 'flow_stopped', r.finishedAt = :now where r.flowId = :flow and r.status = 'active'
jpa.BizFlowRun.claim=update BizFlowRun r set r.nextAt = :lease where r.id = :id and r.status = 'active' and r.nextAt <= :now

# ---------------------------------------------------------------- BizCampaignRepository
jpa.BizCampaign.templateStats=select c.templateId, m.status, count(m) from BizMessage m, BizCampaign c where m.sourceId = c.id and c.ownerId = :owner group by c.templateId, m.status

# ---------------------------------------------------------------- BizCounters
sql.biz-counters.add.insert-biz-counter=insert into biz_counter (id, owner_id, scope, counter_key, value, updated_at) values (:id, :o, :s, :k, :n, :t) on conflict (id) do update set value = biz_counter.value + :n, updated_at = :t
sql.biz-counters.all=select counter_key, value from biz_counter where owner_id = :o and scope = :s
sql.biz-counters.clear.delete-biz-counter=delete from biz_counter where owner_id = :o and scope = :s

# ---------------------------------------------------------------- ApiKeyUsage
sql.api-key-usage.create-table.biz-api-key-usage=create table if not exists biz_api_key_usage (key_id varchar(64) not null, owner_id varchar(64) not null, day date not null, calls bigint not null default 0, refused bigint not null default 0, primary key (key_id, day))
sql.api-key-usage.create-index.ix-biz-api-key-usage-owner-day=create index if not exists ix_biz_api_key_usage_owner_day on biz_api_key_usage (owner_id, day)
sql.api-key-usage.flush.insert-biz-api-key-usage=insert into biz_api_key_usage (key_id, owner_id, day, calls, refused) values (?, ?, ?, ?, ?) on conflict (key_id, day) do update set calls = biz_api_key_usage.calls + excluded.calls, refused = biz_api_key_usage.refused + excluded.refused
sql.api-key-usage.daily=select key_id, day, calls, refused from biz_api_key_usage where owner_id = ? and day >= ?
sql.api-key-usage.forget.delete-biz-api-key-usage=delete from biz_api_key_usage where key_id = ?

# ---------------------------------------------------------------- TriggerUsage
sql.trigger-usage.create-index.ix-notification-log-tenant-created=create index if not exists ix_notification_log_tenant_created on notification_log (tenant_id, created_at)
sql.trigger-usage.sent=select count(*) from notification_log where tenant_id = ? and created_at >= ? and status = 'SUCCESS'
sql.trigger-usage.stats=select to_char(to_timestamp(created_at / 1000.0) at time zone 'Asia/Kolkata', 'YYYY-MM-DD') d, notification_type ch, count(*) filter (where status = 'SUCCESS') ok, count(*) filter (where status <> 'SUCCESS') bad, max(created_at) last from notification_log where tenant_id = ? and created_at >= ? group by 1, 2
sql.trigger-usage.stats-2=select extract(hour from to_timestamp(created_at / 1000.0) at time zone 'Asia/Kolkata')::int h, count(*) n from notification_log where tenant_id = ? and created_at >= ? group by 1
sql.trigger-usage.stats-3=select count(*) filter (where status = 'SUCCESS') ok, count(*) filter (where status <> 'SUCCESS') bad from notification_log where tenant_id = ? and created_at >= ? and created_at < ?
sql.trigger-usage.stats-4=select extract(isodow from to_timestamp(created_at / 1000.0) at time zone 'Asia/Kolkata')::int dw, extract(hour from to_timestamp(created_at / 1000.0) at time zone 'Asia/Kolkata')::int h, count(*) n from notification_log where tenant_id = ? and created_at >= ? group by 1, 2
sql.trigger-usage.stats-5=select ((created_at - ?) / 60000)::int m, count(*) n, count(*) filter (where status <> 'SUCCESS') bad from notification_log where tenant_id = ? and created_at >= ? and created_at <= ? group by 1

# ---------------------------------------------------------------- BizContactRepository
jpa.BizContact.statusCounts=select c.status, count(c) from BizContact c where c.ownerId = :owner group by c.status
jpa.BizContact.cityCounts=select c.city, count(c) from BizContact c where c.ownerId = :owner and c.city is not null and c.city <> '' group by c.city order by count(c) desc
jpa.BizContact.opened=update BizContact c set c.opens = c.opens + 1, c.lastSeenAt = :at where c.id = :id
jpa.BizContact.bounced=update BizContact c set c.status = 'bounced' where c.ownerId = :owner and c.email = :email and c.status = 'subscribed'
jpa.BizContact.unsubscribed=update BizContact c set c.status = 'unsubscribed' where c.ownerId = :owner and c.email = :email
jpa.BizContact.lightRows=select c.id, c.name, c.email, c.status from BizContact c where c.ownerId = :owner

# ---------------------------------------------------------------- BizGroupMemberRepository
jpa.BizGroupMember.counts=select m.groupId, count(m) from BizGroupMember m, BizContact c where m.ownerId = :owner and c.id = m.contactId group by m.groupId
jpa.BizGroupMember.presentIn=select m.contactId from BizGroupMember m where m.groupId = :group and m.contactId in :ids
jpa.BizGroupMember.removeFrom=delete from BizGroupMember m where m.groupId = :group and m.contactId in :ids
jpa.BizGroupMember.clearGroup=delete from BizGroupMember m where m.groupId = :group
jpa.BizGroupMember.forgetContacts=delete from BizGroupMember m where m.contactId in :ids

# ---------------------------------------------------------------- BizLogsService
sql.biz-logs-service.list=select distinct upper(channel), provider_name from biz_message where owner_id = :owner and provider_name is not null and created_at >= :from
sql.biz-logs-service.tail=select * from biz_message where owner_id = :owner and env = :env and created_at > :since order by created_at desc
sql.biz-logs-service.retry.update-biz-message=update biz_message set status = 'queued', due_at = now(), error_code = null, error_text = null, claim_token = null where owner_id = ? and id = any(?) and status in ('failed','bounced')

# ---------------------------------------------------------------- BizEventRepository
jpa.BizEvent.daily=select ref_id, cast(date_trunc('day', at at time zone 'Asia/Kolkata') as date), kind, count(*) from biz_event where owner_id = :owner and stream = :stream and at >= :from group by 1, 2, 3

# ---------------------------------------------------------------- BizMessageRepository
jpa.BizMessage.due=select m.id from BizMessage m where m.status = 'queued' and m.dueAt <= :now order by m.dueAt asc
jpa.BizMessage.claim=update BizMessage m set m.status = 'sending' where m.id = :id and m.status = 'queued'
jpa.BizMessage.unstick=update BizMessage m set m.status = 'queued', m.claimToken = null where m.status = 'sending' and m.dueAt < :before
jpa.BizMessage.statusCountsBySource=select m.status, count(m) from BizMessage m where m.sourceId = :src group by m.status
jpa.BizMessage.statusCountsBySources=select m.sourceId, m.status, count(m) from BizMessage m where m.sourceId in :ids group by m.sourceId, m.status
jpa.BizMessage.stepCounts=select m.stepId, m.status, count(m) from BizMessage m where m.sourceId = :src group by m.stepId, m.status
jpa.BizMessage.pauseSource=update BizMessage m set m.status = 'paused' where m.sourceId = :src and m.status = 'queued'
jpa.BizMessage.resumeSource=update BizMessage m set m.status = 'queued' where m.sourceId = :src and m.status = 'paused'
jpa.BizMessage.dropUnsent=delete from BizMessage m where m.sourceId = :src and m.status in ('queued', 'paused')
jpa.BizMessage.retryFailed=update BizMessage m set m.status = 'queued', m.dueAt = :now, m.errorCode = null, m.errorText = null where m.sourceId = :src and m.status = 'failed'
jpa.BizMessage.since=select m from BizMessage m where m.ownerId = :owner and m.createdAt >= :from order by m.createdAt asc
jpa.BizMessage.providerDaily=select provider_id, status, cast(date_trunc('day', created_at at time zone 'Asia/Kolkata') as date), count(*), coalesce(sum(latency_ms), 0), count(latency_ms) from biz_message where owner_id = :owner and created_at >= :from and env = 'live' and provider_id is not null group by 1, 2, 3
jpa.BizMessage.bySubject=select m.subject, m.status, count(m) from BizMessage m where m.ownerId = :owner and m.source = :source group by m.subject, m.status
jpa.BizMessage.liveUsed=select count(m) from BizMessage m where m.ownerId = :owner and m.env = 'live' and m.createdAt >= :from and m.status not in ('failed','suppressed')
jpa.BizMessage.liveUsedByChannel=select m.channel, count(m) from BizMessage m where m.ownerId = :owner and m.env = 'live' and m.createdAt >= :from and m.status not in ('failed','suppressed') group by m.channel
jpa.BizMessage.engagementByContact=select contact_id, count(*) filter (where status in ('delivered','opened','clicked')), count(opened_at), count(clicked_at), count(*) filter (where status = 'bounced'), max(opened_at), max(clicked_at), max(coalesce(sent_at, created_at)) from biz_message where owner_id = :owner and channel = 'email' and env = 'live' and contact_id is not null and created_at >= :from group by contact_id

# ---------------------------------------------------------------- DeliveryWorker
sql.delivery-worker.tick=select count(*) from biz_message where status = 'sending' and claim_token is not null
sql.delivery-worker.tick.update-biz-message=update biz_message set status = 'sending', due_at = now(), claim_token = substr(md5(random()::text || id), 1, 16) \
    where id in (select id from biz_message where status = 'queued' and due_at <= now() order by due_at limit ? for update skip locked) \
    returning id, owner_id, claim_token
sql.delivery-worker.consume.update-biz-message=update biz_message set claim_token = null where id = ? and claim_token = ? and status = 'sending'

# ---------------------------------------------------------------- BizPreflightRepository
jpa.BizPreflight.verdicts=select p.verdict, count(p), avg(p.score) from BizPreflight p where p.createdAt >= :from group by p.verdict
jpa.BizPreflight.issues=select p.fails, p.warns from BizPreflight p where p.createdAt >= :from
jpa.BizPreflight.daily=select cast(date_trunc('day', created_at at time zone 'Asia/Kolkata') as date), count(*), avg(score) from biz_preflight where created_at >= :from group by 1 order by 1
jpa.BizPreflight.owners=select count(distinct p.ownerId) from BizPreflight p where p.createdAt >= :from
jpa.BizPreflight.deleteOlderThan=delete from BizPreflight p where p.createdAt < :before

# ---------------------------------------------------------------- HealthService
sql.health-service.full=select count(*) from biz_message where status in ('queued','sending')
sql.health-service.full-2=select count(*) from biz_flow_run where status = 'active'

# ---------------------------------------------------------------- EnumCheckRepair
sql.enum-check-repair.repair=select pg_get_constraintdef(oid) from pg_constraint where conname = ? and conrelid = to_regclass(?)

# ---------------------------------------------------------------- StudentTrackerSchemaFix
sql.student-tracker-schema-fix.relax=select is_nullable from information_schema.columns where table_name = 'student_application' and column_name = 'email'
sql.student-tracker-schema-fix.relax-2=alter table student_application alter column email drop not null

# ---------------------------------------------------------------- QnBroadcast
sql.qn-broadcast.create-table.qn-cluster-event=create table if not exists qn_cluster_event ( \
    id bigserial primary key, event_id varchar(40) not null, type varchar(60) not null, payload text, origin varchar(120), \
    created_at timestamptz not null default now())
sql.qn-broadcast.init=select coalesce(max(id), 0) from qn_cluster_event
sql.qn-broadcast.send.insert-qn-cluster-event=insert into qn_cluster_event(event_id, type, payload, origin) values (?, ?, ?, ?)
sql.qn-broadcast.send.delete-qn-cluster-event=delete from qn_cluster_event where created_at < now() - interval '1 day'
sql.qn-broadcast.poll-table=select id, payload from qn_cluster_event where id > ? order by id limit 200

# ---------------------------------------------------------------- QnClusterEvents
sql.qn-cluster-events.create-table.qn-flag=create table if not exists qn_flag (name varchar(60) primary key, value varchar(200), by_who varchar(200), at timestamptz not null default now())
sql.qn-cluster-events.apply-stored-pause=select value, by_who from qn_flag where name = 'queues.paused'
sql.qn-cluster-events.store-pause.insert-qn-flag=insert into qn_flag(name, value, by_who, at) values ('queues.paused', ?, ?, now()) on conflict (name) do update set value = excluded.value, by_who = excluded.by_who, at = now()

# ---------------------------------------------------------------- QnOutbox
sql.qn-outbox.create-table.qn-outbox=create table if not exists qn_outbox ( \
    id bigserial primary key, topic varchar(60) not null, msg_key varchar(200), payload text not null, headers text, \
    available_at timestamptz not null default now(), created_at timestamptz not null default now(), attempts int not null default 0, \
    locked_by varchar(120), locked_until timestamptz, last_error varchar(500))
sql.qn-outbox.create-index.ix-qn-outbox-due=create index if not exists ix_qn_outbox_due on qn_outbox(available_at, id)
sql.qn-outbox.create-table.qn-dead-letter=create table if not exists qn_dead_letter ( \
    id bigserial primary key, topic varchar(60) not null, msg_key varchar(200), payload text not null, headers text, \
    error varchar(1000), tries int, created_at timestamptz not null default now(), replayed_at timestamptz)
sql.qn-outbox.add.insert-qn-outbox=insert into qn_outbox(topic, msg_key, payload, headers, available_at) values (?, ?, ?, ?, ?)
sql.qn-outbox.add-all.insert-qn-outbox=insert into qn_outbox(topic, msg_key, payload, available_at) values (?, ?, ?, ?)
sql.qn-outbox.tick.update-qn-outbox=update qn_outbox set locked_by = ?, locked_until = now() + interval '10 minutes', attempts = attempts + 1 \
    where id in (select id from qn_outbox where available_at <= now() and (locked_until is null or locked_until < now()) \
    order by available_at, id limit ? for update skip locked) \
    returning id, topic, msg_key, payload, headers, attempts
sql.qn-outbox.release.update-qn-outbox=update qn_outbox set locked_by = null, locked_until = null, available_at = now() + make_interval(secs => ?), last_error = coalesce(?, last_error) where id = ?
sql.qn-outbox.delete.delete-qn-outbox=delete from qn_outbox where id = any(?)
sql.qn-outbox.to-dead-letter.insert-qn-dead-letter=insert into qn_dead_letter(topic, msg_key, payload, headers, error, tries) values (?, ?, ?, ?, ?, ?)
sql.qn-outbox.replay=select id, topic, msg_key, payload, headers from qn_dead_letter where replayed_at is null order by id limit 1000
sql.qn-outbox.replay-2=select id, topic, msg_key, payload, headers from qn_dead_letter where id = ? and replayed_at is null
sql.qn-outbox.replay.insert-qn-outbox=insert into qn_outbox(topic, msg_key, payload, headers) values (?, ?, ?, ?)
sql.qn-outbox.replay.update-qn-dead-letter=update qn_dead_letter set replayed_at = now() where id = ?
sql.qn-outbox.stats=select topic, count(*) filter (where available_at <= now()) as due, count(*) filter (where available_at > now()) as later, \
    count(*) filter (where locked_until > now()) as working, min(available_at) filter (where available_at <= now()) as oldest_due \
    from qn_outbox group by topic order by topic
sql.qn-outbox.stats-2=select count(*) from qn_dead_letter where replayed_at is null
sql.qn-outbox.dead-letters=select id, topic, msg_key, left(payload, 400) as payload, error, tries, created_at from qn_dead_letter where replayed_at is null order by id desc limit ?

# ---------------------------------------------------------------- QnQueues
sql.qn-queues.sends=select status, count(*) n from qn_trigger_batch where created_at > now() - interval '24 hours' group by status order by status
sql.qn-queues.sends-2=select count(*) filter (where status in ('queued','sending')) as waiting, count(*) filter (where status = 'retry') as retrying, \
    count(*) filter (where status = 'sent' and updated_at > now() - interval '1 hour') as sent_hour, \
    count(*) filter (where status = 'failed' and updated_at > now() - interval '1 hour') as failed_hour \
    from qn_delivery where status in ('queued','sending','retry') or updated_at > now() - interval '1 hour'

# ---------------------------------------------------------------- TriggerQueue
sql.trigger-queue.create-table.qn-trigger-batch=create table if not exists qn_trigger_batch ( \
    id varchar(64) primary key, tenant_id varchar(64) not null, request_id varchar(120), recipient_type varchar(20), channel varchar(20), \
    total int, sent int not null default 0, failed int not null default 0, status varchar(12) not null, send_at timestamptz, \
    created_at timestamptz not null default now(), expanded_at timestamptz, finished_at timestamptz, error varchar(500), file_id varchar(64), \
    via varchar(10))
sql.trigger-queue.create-index.ix-qn-trigger-batch-tenant=create index if not exists ix_qn_trigger_batch_tenant on qn_trigger_batch(tenant_id, created_at desc)
sql.trigger-queue.create-table.qn-delivery=create table if not exists qn_delivery ( \
    id varchar(90) primary key, batch_id varchar(64) not null, tenant_id varchar(64) not null, recipient varchar(400), payload text not null, \
    status varchar(10) not null, attempts int not null default 0, last_error varchar(500), node varchar(120), \
    created_at timestamptz not null default now(), updated_at timestamptz not null default now())
sql.trigger-queue.create-index.ix-qn-delivery-batch=create index if not exists ix_qn_delivery_batch on qn_delivery(batch_id, status)
sql.trigger-queue.create-table.qn-trigger-file=create table if not exists qn_trigger_file ( \
    id varchar(64) primary key, tenant_id varchar(64) not null, name varchar(300), content_type varchar(120), bytes bytea not null, \
    created_at timestamptz not null default now())
sql.trigger-queue.accept.insert-qn-trigger-batch=insert into qn_trigger_batch(id, tenant_id, request_id, recipient_type, channel, total, status, send_at, file_id) values (?, ?, ?, ?, ?, ?, ?, ?, ?)
sql.trigger-queue.accept.insert-qn-trigger-file=insert into qn_trigger_file(id, tenant_id, name, content_type, bytes) values (?, ?, ?, ?, ?)
sql.trigger-queue.batch=select b.id, b.status, b.recipient_type, b.channel, b.total, b.sent, b.failed, b.created_at, b.send_at, b.finished_at, b.error, \
    (select count(*) from qn_delivery d where d.batch_id = b.id and d.status = 'retry') as retrying, b.via \
    from qn_trigger_batch b where b.id = ? and b.tenant_id = ?
sql.trigger-queue.batch-2=select recipient, last_error, attempts from qn_delivery where batch_id = ? and status = 'failed' order by updated_at desc limit 25
sql.trigger-queue.recent=select id as "batchId", status, recipient_type as "recipientType", channel, total, sent, failed, created_at as "createdAt", \
    send_at as "sendAt", finished_at as "finishedAt" from qn_trigger_batch where tenant_id = ? order by created_at desc limit ?
sql.trigger-queue.cancel.update-qn-trigger-batch=update qn_trigger_batch set status = 'cancelled', finished_at = now() where id = ? and tenant_id = ? and status = 'scheduled'
sql.trigger-queue.cancel.delete-qn-outbox=delete from qn_outbox where topic = ? and msg_key = ?
sql.trigger-queue.retry-failed.update-qn-delivery=update qn_delivery set status = 'queued', attempts = 0, last_error = null, updated_at = now() where batch_id = ? and status = 'failed' returning id
sql.trigger-queue.retry-failed.update-qn-trigger-batch=update qn_trigger_batch set failed = failed - ?, status = 'sending', finished_at = null where id = ?
sql.trigger-queue.on-trigger.insert-qn-trigger-batch=insert into qn_trigger_batch(id, tenant_id, request_id, recipient_type, status, error, finished_at) values (?, ?, ?, ?, ?, ?, ?) on conflict (id) do nothing
sql.trigger-queue.on-trigger=select status from qn_trigger_batch where id = ?
sql.trigger-queue.on-trigger.update-qn-trigger-batch=update qn_trigger_batch set status = 'sending', expanded_at = now(), total = ?, via = ? where id = ? and status in ('queued', 'scheduled')
sql.trigger-queue.on-trigger.insert-qn-delivery=insert into qn_delivery(id, batch_id, tenant_id, recipient, payload, status) values (?, ?, ?, ?, ?, 'queued') on conflict (id) do nothing
sql.trigger-queue.on-delivery.update-qn-delivery=update qn_delivery set status = 'sending', attempts = attempts + 1, node = ?, updated_at = now() \
    where id = ? and (status in ('queued', 'retry') or (status = 'sending' and updated_at < now() - interval '10 minutes')) \
    returning payload, attempts, batch_id, tenant_id
sql.trigger-queue.on-delivery.update-qn-delivery-2=update qn_delivery set status = 'sent', last_error = null, updated_at = now() where id = ?
sql.trigger-queue.on-delivery.update-qn-trigger-batch=update qn_trigger_batch set sent = sent + 1 where id = ?
sql.trigger-queue.on-delivery.update-qn-delivery-3=update qn_delivery set status = 'retry', last_error = ?, updated_at = now() where id = ?
sql.trigger-queue.on-delivery.update-qn-delivery-4=update qn_delivery set status = 'failed', last_error = ?, updated_at = now() where id = ?
sql.trigger-queue.on-delivery.update-qn-trigger-batch-2=update qn_trigger_batch set failed = failed + 1 where id = ?
sql.trigger-queue.finish-if-done.update-qn-trigger-batch=update qn_trigger_batch set status = case when failed = 0 then 'done' when sent = 0 then 'failed' else 'partial' end, finished_at = now() \
    where id = ? and finished_at is null and total is not null and sent + failed >= total and status = 'sending' \
    returning status || '|' || sent || '|' || failed || '|' || coalesce(file_id, '')
sql.trigger-queue.finish-if-done.delete-qn-trigger-file=delete from qn_trigger_file where id = ?
sql.trigger-queue.fail.update-qn-trigger-batch=update qn_trigger_batch set status = 'failed', error = ?, total = coalesce(total, 0), finished_at = now() where id = ? and status in ('queued', 'scheduled')
sql.trigger-queue.file=select name, content_type, bytes from qn_trigger_file where id = ?
sql.trigger-queue.delivery-msg=select request_id, file_id from qn_trigger_batch where id = ?

# ---------------------------------------------------------------- UserNotificationRepository
jpa.UserNotification.markRead=update UserNotification n set n.readAt = :now where n.ownerId = :owner and n.readAt is null and (:all = true or n.id in :ids)
jpa.UserNotification.clear=delete from UserNotification n where n.ownerId = :owner
jpa.UserNotification.deleteOlderThan=delete from UserNotification n where n.createdAt < :before

