# =====================================================================================================
#  QuickNotify · notification service (mails, campaigns, contacts, templates, automations, scheduler)
#  Read at start-up AND every 60 seconds after. Commit + push → applied in about a minute, NO restart
#  (Admin → System → "Reload settings now" reads it at once; GitHub can serve the old file for ~5 min).
#  Order: environment (deploy/.env, deploy/config/*.env) > this file > the built-in application.yml.
#  PUBLIC REPO: no secrets here. JWT secret, keys, passwords, database, Kafka/ES addresses stay in Docker.
#  Keys marked (restart) are read once at start: change them, then ./deploy.sh restart notification
# =====================================================================================================

# --- how much gets logged: TRACE, DEBUG, INFO, WARN, ERROR (applied live)
logging.level.root=INFO
logging.level.com.make.application=INFO
logging.level.org.hibernate.SQL=WARN
# a service call slower than this is logged as a WARN (restart)
app.logging.slow-call-ms=1000

# --- "Get started" test mail: how many one account may send per window (applied live)
app.onboarding.test-mail.per-window=5
app.onboarding.test-mail.window-minutes=10

# --- delivery providers a paid plan may have when the plan itself doesn't say (applied live)
app.providers.paid-limit=25

# --- WhatsApp sign-in codes: the approved template and its language (number + token stay in Docker)
app.providers.platform-whatsapp.otp-template=quicknotify_login_code
app.providers.platform-whatsapp.template-language=en

# --- job seekers: mails per day when the plan does not say, group and attachment limits
student.daily-limit=40
student.max-groups=20
student.max-group-size=10
student.max-attachment-bytes=10485760
# scheduled mails: how often the scheduler looks (ms), how many per round, tries (restart)
student.scheduler.delay-ms=30000
student.scheduler.batch-size=20
student.scheduler.max-attempts=3

# --- business sending: worker speed, retries, threads (restart)
biz.worker.delay-ms=2000
biz.worker.batch=100
biz.worker.max-attempts=4
biz.worker.threads=8
biz.campaigns.check-ms=20000
biz.automations.tick-ms=5000

# --- cost per message shown in analytics (paise) (restart)
biz.cost.email-paise=0
biz.cost.sms-paise=18
biz.cost.whatsapp-paise=35
biz.cost.push-paise=0

# --- login session check with the account manager (logout / revoke reach this service) (restart)
app.auth.session-check=true
app.auth.session-check-ttl-ms=20000
app.auth.session-check-fail-closed=false

# --- delivery logs in Elasticsearch / the database (restart)
notification.logging.db.enabled=true
notification.logging.elastic.enabled=true
elasticsearch.index.name=notification-logs
kafka.topic.name=notification

# --- how often this file is read again (seconds) (restart)
app.config.poll-seconds=60
app.config.timeout-ms=5000

# --- log files (deploy/logs/notification): a new part every file-size, kept max-days (restart)
app.logs.file-size=10MB
app.logs.max-days=14
app.logs.total-cap=1GB
