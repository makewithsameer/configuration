sql.platform-stats-service.stats=select count(*) from biz_message where status in ('queued','sending','paused')
sql.platform-stats-service.stats-2=select count(*) from student_mail where status in ('scheduled','sending','paused')
sql.platform-stats-service.stats-3=select count(*) from biz_message where status = 'queued' and due_at < ?
sql.platform-stats-service.stats-4=select count(*) from student_mail where status = 'scheduled' and send_at < ?
sql.platform-stats-service.stats-5=select count(*) from biz_message where status in ('failed','bounced') and due_at >= ?
sql.platform-stats-service.stats-6=select count(*) from student_mail where status = 'failed' and send_at >= ?
sql.platform-stats-service.stats-7=select (sent_at at time zone 'Asia/Kolkata')::date d, count(*) n from student_mail where sent_at >= ? group by 1

# ---------------------------------------------------------------- TemplateLibraryLoader
sql.template-library-loader.count=select count(*) from template_library

# ---------------------------------------------------------------- MeService
sql.me-service.student=select to_timestamp(min(created_at) / 1000.0) from template where tenant_id = ? and owner_type = 'STUDENT'
sql.me-service.student-2=select to_timestamp(min(created_at) / 1000.0) from groups where tenant_id = ? and owner_type = 'STUDENT'
sql.me-service.product=select count(*) from biz_message where owner_id = ? and source <> 'api' and opened_at is not null and sent_at >= ?
sql.me-service.product-2=select count(*) from biz_message where owner_id = ? and source <> 'api' and clicked_at is not null and sent_at >= ?
sql.me-service.product-3=select count(*) from biz_contact where owner_id = ? and status = 'subscribed'
sql.me-service.product-4=select to_timestamp(min(created_at) / 1000.0) from template where tenant_id = ? and owner_type in ('PRODUCT', 'COMPANY')
sql.me-service.product-5=select min(created_at) from biz_campaign where owner_id = ? and status <> 'draft'
sql.me-service.product-6=select min(connected_at) from provider where tenant_id = ? and owner_type in ('PRODUCT', 'COMPANY')
sql.me-service.product-7=select min(created_at) from biz_doc where owner_id = ? and kind = 'integration'
sql.me-service.product-8=select min(updated_at) from biz_doc where owner_id = ? and kind = 'automation' and status = 'live'
sql.me-service.company=select count(*) from biz_message where owner_id = ? and source = 'api' and env = 'live' and created_at >= ?
sql.me-service.company-2=select count(*) from biz_message where owner_id = ? and source = 'api' and env = 'live' and created_at >= ? and created_at < ?
sql.me-service.company-3=select count(*) from biz_message where owner_id = ? and source = 'api' and env = 'live' and status in ('failed','bounced') and created_at >= ?
sql.me-service.company-4=select count(*) from biz_api_key where owner_id = ? and revoked_at is null
sql.me-service.company-5=select min(created_at) from biz_api_key where owner_id = ?
sql.me-service.company-6=select min(created_at) from biz_api_key where owner_id = ? and env = 'live'
sql.me-service.company-7=select min(created_at) from biz_message where owner_id = ? and source = 'api'
sql.me-service.company-8=select min(created_at) from biz_doc where owner_id = ? and kind = 'webhook'

# ---------------------------------------------------------------- OwnerDataEraser
sql.owner-data-eraser.erase.delete-student-group-member=delete from student_group_member where group_id in (select id from student_group where owner_id = ?)
sql.owner-data-eraser.owner-tables=select table_name, column_name from information_schema.columns where table_schema = current_schema() and column_name in ('owner_id', 'tenant_id') and table_name in (select table_name from information_schema.tables where table_schema = current_schema() and table_type = 'BASE TABLE')
sql.owner-data-eraser.delete-attachment-files=select stored_name from student_attachment where owner_id = ? and stored_name is not null

# ---------------------------------------------------------------- ProviderMigration
sql.provider-migration.vendor-columns-to-enums.update-provider=update provider set provider = coalesce(provider, ?), notification_type = coalesce(notification_type, ?) where lower(vendor) = ? and (provider is null or notification_type is null)
sql.provider-migration.vendor-columns-to-enums=select count(*) from provider where provider is null
sql.provider-migration.vendor-columns-to-enums-2=alter table provider drop column if exists vendor
sql.provider-migration.vendor-columns-to-enums-3=alter table provider drop column if exists channel
sql.provider-migration.student-mailboxes=select * from student_mailbox where coalesce(status, '') not in (?, ?)
sql.provider-migration.student-mailboxes.update-student-mailbox=update student_mailbox set status = ? where id = ?
sql.provider-migration.student-mailboxes.update-student-mailbox-2=update student_mailbox set status = ? where id = ?
sql.provider-migration.business-providers=select id, owner_id, data_json, created_at from biz_doc where kind = 'provider'
sql.provider-migration.business-providers-2=select count(*) from biz_api_key where owner_id = ?
sql.provider-migration.plain-json-credentials=select id, credentials::text as c from provider where credentials is not null
sql.provider-migration.plain-json-credentials.update-provider=update provider set credentials = null where id = ?
sql.provider-migration.column-exists=select count(*) from information_schema.columns where table_name = ? and column_name = ?

# ---------------------------------------------------------------- GroupRepository
jpa.Group.findByIdAndTenantId=SELECT g FROM Group g WHERE g.id = :id AND g.tenantId = :tenantId
jpa.Group.findByNameAndTenantId=SELECT g FROM Group g WHERE g.name = :name AND g.tenantId = :tenantId

# ---------------------------------------------------------------- NotificationLogRepository
jpa.NotificationLog.findByCriteria=SELECT n FROM NotificationLog n WHERE n.tenantId = :tenantId AND (:id IS NULL OR n.id = :id) AND (:notificationType IS NULL OR n.notificationType = :notificationType) AND (:provider IS NULL OR n.provider = :provider) AND (:sender IS NULL OR n.sender = :sender) AND (:dateCreated IS NULL OR n.dateCreated = :dateCreated) AND (:receiver IS NULL OR n.receiver = :receiver)
jpa.NotificationLog.findPageByCriteria=SELECT n FROM NotificationLog n WHERE n.tenantId = :tenantId AND (:id IS NULL OR n.id = :id) AND (:notificationType IS NULL OR n.notificationType = :notificationType) AND (:provider IS NULL OR n.provider = :provider) AND (:sender IS NULL OR n.sender = :sender) AND (:dateCreated IS NULL OR n.dateCreated = :dateCreated) AND (:receiver IS NULL OR n.receiver = :receiver)
jpa.NotificationLog.findByRequestId=SELECT n FROM NotificationLog n WHERE n.tenantId = :tenantId AND n.requestId = :requestId

# ---------------------------------------------------------------- ProviderRepository
jpa.Provider.findByIdAndTenantId=SELECT p FROM Provider p WHERE p.id = :id AND p.tenantId = :tenantId
jpa.Provider.findByNameAndTenantId=SELECT p FROM Provider p WHERE p.name = :name AND p.tenantId = :tenantId
jpa.Provider.countByOwnerType=SELECT p.ownerType, COUNT(p) FROM Provider p GROUP BY p.ownerType

# ---------------------------------------------------------------- TemplateRepository
jpa.Template.findByNameAndTenantId=SELECT t FROM Template t WHERE t.name = :name AND t.tenantId = :tenantId
jpa.Template.findByIdAndTenantId=SELECT t FROM Template t WHERE t.id = :id AND t.tenantId = :tenantId

# ---------------------------------------------------------------- StudentMailScheduler
sql.student-mail-scheduler.consume.update-student-mail=update student_mail set claim_token = null where id = ? and claim_token = ? and status = 'sending'

# ---------------------------------------------------------------- JobAutopilotService
sql.job-autopilot-service.create-table.student-autopilot=create table if not exists student_autopilot ( \
    owner_id varchar(40) primary key, enabled boolean not null default false, mode varchar(8) not null default 'review', \
    min_match int not null default 60, daily_cap int not null default 8, subject varchar(300), body text, attachments text, exclude text, \
    enabled_at timestamptz, last_run_at timestamptz, last_error varchar(300), last_stats text, updated_at timestamptz not null)
sql.job-autopilot-service.create-table.job-autopilot-run=create table if not exists job_autopilot_run ( \
    id varchar(24) primary key, owner_id varchar(40) not null, job_id varchar(24) not null, company varchar(120), title varchar(160), \
    url varchar(600), match int, to_email varchar(320), to_name varchar(160), contact_from varchar(12), status varchar(12) not null, \
    why varchar(300), subject varchar(300), body text, send_at timestamptz, send_label varchar(80), time_source varchar(80), \
    mail_id varchar(40), manual boolean not null default false, created_at timestamptz not null, decided_at timestamptz)
sql.job-autopilot-service.create-index.ux-job-autopilot-run=create unique index if not exists ux_job_autopilot_run on job_autopilot_run(owner_id, job_id)
sql.job-autopilot-service.create-index.ix-job-autopilot-run-owner=create index if not exists ix_job_autopilot_run_owner on job_autopilot_run(owner_id, created_at desc)
sql.job-autopilot-service.conf=select enabled, mode, min_match, daily_cap, subject, body, attachments, exclude, enabled_at, last_run_at, last_error, last_stats from student_autopilot where owner_id = ?
sql.job-autopilot-service.save.insert-student-autopilot=insert into student_autopilot(owner_id, enabled, mode, min_match, daily_cap, subject, body, attachments, exclude, enabled_at, updated_at) \
    values (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, now()) \
    on conflict (owner_id) do update set enabled = excluded.enabled, mode = excluded.mode, min_match = excluded.min_match, \
    daily_cap = excluded.daily_cap, subject = excluded.subject, body = excluded.body, attachments = excluded.attachments, \
    exclude = excluded.exclude, enabled_at = coalesce(?, student_autopilot.enabled_at), last_error = null, updated_at = now()
sql.job-autopilot-service.run-due.update-student-autopilot=update student_autopilot set last_run_at = now(), last_error = ? where owner_id = ?
sql.job-autopilot-service.run=select job_id from job_autopilot_run where owner_id = ?
sql.job-autopilot-service.run.update-student-autopilot=update student_autopilot set last_run_at = ?, last_error = null, last_stats = ? where owner_id = ?
sql.job-autopilot-service.stop.update-student-autopilot=update student_autopilot set last_run_at = now(), last_error = ? where owner_id = ?
sql.job-autopilot-service.used-today=select count(*) from job_autopilot_run where owner_id = ? and not manual and created_at >= ? and status in ('review', 'queued')
sql.job-autopilot-service.who=select email, name, org, role from student_contact where owner_id = ? and org is not null and lower(org) like ? limit 200
sql.job-autopilot-service.who-2=select to_email, to_name, to_org from student_mail where owner_id = ? and to_org is not null and lower(to_org) like ? \
    and status in ('sent', 'opened') and coalesce(sent_at, created_at) < now() - interval '30 days' order by sent_at desc limit 50
sql.job-autopilot-service.insert.insert-job-autopilot-run=insert into job_autopilot_run(id, owner_id, job_id, company, title, url, match, to_email, to_name, contact_from, status, why, subject, body, \
    send_at, send_label, time_source, mail_id, manual, created_at) values (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, now()) \
    on conflict (owner_id, job_id) do nothing
sql.job-autopilot-service.schedule.update-job-autopilot-run=update job_autopilot_run set status = 'queued', why = ?, mail_id = ?, subject = ?, body = ?, send_at = ?, send_label = ?, time_source = ?, decided_at = now() where id = ?
sql.job-autopilot-service.mark-failed.update-job-autopilot-run=update job_autopilot_run set status = 'failed', why = ?, decided_at = now() where id = ?
sql.job-autopilot-service.approve-one.update-job-autopilot-run=update job_autopilot_run set to_email = ?, to_name = ?, contact_from = ?, subject = ?, body = ? where id = ?
sql.job-autopilot-service.approve-all.update-job-autopilot-run=update job_autopilot_run set why = ? where id = ?
sql.job-autopilot-service.skip.update-job-autopilot-run=update job_autopilot_run set status = 'skipped', why = 'Skipped by you.', decided_at = now() where id = ?
sql.job-autopilot-service.cancel.update-job-autopilot-run=update job_autopilot_run set status = 'skipped', why = 'Cancelled by you before it went out.', mail_id = null, decided_at = now() where id = ?
sql.job-autopilot-service.add-contact.update-job-autopilot-run=update job_autopilot_run set to_email = ?, to_name = ?, contact_from = 'you', status = 'review', why = 'Ready for you: approve, edit or skip.', \
    subject = ?, body = ?, send_at = ?, send_label = ?, time_source = ? where id = ?
sql.job-autopilot-service.for-job.delete-job-autopilot-run=delete from job_autopilot_run where id = ?

# ---------------------------------------------------------------- JobRadarService
sql.job-radar-service.create-table.job-source=create table if not exists job_source ( \
    id varchar(24) primary key, ats varchar(20) not null, token varchar(80) not null, company varchar(120) not null, \
    enabled boolean not null default true, added_by varchar(40), created_at timestamptz not null, \
    last_run_at timestamptz, last_ok_at timestamptz, last_error varchar(300), fails int not null default 0, jobs int not null default 0)
sql.job-radar-service.create-index.ux-job-source=create unique index if not exists ux_job_source on job_source(ats, lower(token))
sql.job-radar-service.create-table.job-listing=create table if not exists job_listing ( \
    id varchar(24) primary key, kind varchar(10) not null, source varchar(20) not null, source_id varchar(24), ext_id varchar(200) not null, \
    owner_id varchar(40), dedupe_key varchar(400) not null, company varchar(120), title varchar(160) not null, location varchar(120), \
    city varchar(60), remote boolean, work_type varchar(60), team varchar(120), exp_min int, exp_max int, salary varchar(80), \
    url varchar(600), description text, deadline date, posted_at timestamptz, first_seen_at timestamptz not null, \
    last_seen_at timestamptz not null, closed_at timestamptz)
sql.job-radar-service.create-index.ux-job-listing=create unique index if not exists ux_job_listing on job_listing(source, ext_id, coalesce(owner_id, ''))
sql.job-radar-service.create-index.ix-job-listing-open=create index if not exists ix_job_listing_open on job_listing(closed_at, last_seen_at desc)
sql.job-radar-service.create-index.ix-job-listing-owner=create index if not exists ix_job_listing_owner on job_listing(owner_id)
sql.job-radar-service.create-index.ix-job-listing-source=create index if not exists ix_job_listing_source on job_listing(source_id)
sql.job-radar-service.create-table.student-job-state=create table if not exists student_job_state ( \
    owner_id varchar(40) not null, job_id varchar(24) not null, state varchar(10) not null, app_id varchar(40), \
    updated_at timestamptz not null, primary key (owner_id, job_id))
sql.job-radar-service.create-table.student-job-prefs=create table if not exists student_job_prefs ( \
    owner_id varchar(40) primary key, roles text, cities text, remote boolean not null default false, level varchar(12), \
    years int, inbox_on boolean not null default false, inbox_at timestamptz, inbox_last_scan timestamptz, inbox_stats text, \
    inbox_error varchar(300), updated_at timestamptz not null)
sql.job-radar-service.init=alter table job_listing add column if not exists contact_email varchar(320)
sql.job-radar-service.init-2=alter table student_job_prefs add column if not exists seen_at timestamptz
sql.job-radar-service.init-3=alter table student_job_prefs add column if not exists inbox_scan_state varchar(12)
sql.job-radar-service.init-4=alter table student_job_prefs add column if not exists inbox_scan_started timestamptz
sql.job-radar-service.init-5=alter table student_job_prefs add column if not exists inbox_scan_progress text
sql.job-radar-service.init-6=alter table student_job_prefs add column if not exists inbox_uids text
sql.job-radar-service.init-7=alter table student_job_prefs add column if not exists inbox_scan_history text
sql.job-radar-service.init-8=alter table student_job_prefs add column if not exists inbox_scan_beat timestamptz
sql.job-radar-service.init-9=alter table job_source add column if not exists origin varchar(12) not null default 'admin'
sql.job-radar-service.create-table.student-job-follow=create table if not exists student_job_follow ( \
    owner_id varchar(40) not null, source_id varchar(24) not null, created_at timestamptz not null, primary key (owner_id, source_id))
sql.job-radar-service.create-index.ix-student-job-follow-source=create index if not exists ix_student_job_follow_source on student_job_follow(source_id)
sql.job-radar-service.feed=select seen_at from student_job_prefs where owner_id = ?
sql.job-radar-service.feed-2=select count(*) from job_source where enabled and jobs > 0
sql.job-radar-service.scored=select job_id, state, app_id from student_job_state where owner_id = ?
sql.job-radar-service.scored-2=select source_id from student_job_follow where owner_id = ?
sql.job-radar-service.mark-seen.insert-student-job-prefs=insert into student_job_prefs(owner_id, seen_at, updated_at) values (?, now(), now()) \
    on conflict (owner_id) do update set seen_at = now()
sql.job-radar-service.prefs=select roles, cities, remote, level, years from student_job_prefs where owner_id = ?
sql.job-radar-service.save-prefs.insert-student-job-prefs=insert into student_job_prefs(owner_id, roles, cities, remote, level, years, updated_at) values (?, ?, ?, ?, ?, ?, now()) \
    on conflict (owner_id) do update set roles = excluded.roles, cities = excluded.cities, remote = excluded.remote, level = excluded.level, \
    years = excluded.years, updated_at = now()
sql.job-radar-service.set-state.delete-student-job-state=delete from student_job_state where owner_id = ? and job_id = ? and state <> 'tracked'
sql.job-radar-service.set-state.insert-student-job-state=insert into student_job_state(owner_id, job_id, state, updated_at) values (?, ?, ?, now()) \
    on conflict (owner_id, job_id) do update set state = excluded.state, updated_at = now()
sql.job-radar-service.track.insert-student-job-state=insert into student_job_state(owner_id, job_id, state, app_id, updated_at) values (?, ?, 'tracked', ?, now()) \
    on conflict (owner_id, job_id) do update set state = 'tracked', app_id = excluded.app_id, updated_at = now()
sql.job-radar-service.current=select state, app_id from student_job_state where owner_id = ? and job_id = ?
sql.job-radar-service.paste=select count(*) from job_listing where owner_id = ? and kind = 'paste' and closed_at is null
sql.job-radar-service.upsert=select id from job_listing where source = ? and ext_id = ? and coalesce(owner_id, '') = coalesce(?, '')
sql.job-radar-service.upsert.update-job-listing=update job_listing set title = ?, company = ?, location = ?, city = ?, remote = ?, work_type = ?, team = ?, exp_min = ?, exp_max = ?, \
    salary = coalesce(?, salary), url = coalesce(?, url), description = coalesce(?, description), deadline = coalesce(?, deadline), \
    posted_at = coalesce(posted_at, ?), dedupe_key = ?, last_seen_at = ?, closed_at = null, contact_email = coalesce(?, contact_email), \
    source_id = coalesce(?, source_id) where id = ?
sql.job-radar-service.sources=select id, ats, token, company, enabled, last_run_at, last_ok_at, last_error, fails, jobs from job_source order by company
sql.job-radar-service.add-source=select count(*) from job_source
sql.job-radar-service.add-source-2=select count(*) from job_source where ats = ? and lower(token) = lower(?)
sql.job-radar-service.add-source.insert-job-source=insert into job_source(id, ats, token, company, enabled, added_by, created_at) values (?, ?, ?, ?, true, ?, now())
sql.job-radar-service.remove-source.delete-job-source=delete from job_source where id = ?
sql.job-radar-service.remove-source.update-job-listing=update job_listing set closed_at = now() where source_id = ? and closed_at is null
sql.job-radar-service.set-source-enabled.update-job-source=update job_source set enabled = ?, fails = case when ? then 0 else fails end where id = ?
sql.job-radar-service.refresh-source=select ats, token, company from job_source where id = ?
sql.job-radar-service.refresh-source.update-job-listing=update job_listing set closed_at = ? where source_id = ? and closed_at is null and last_seen_at < ?
sql.job-radar-service.refresh-source.update-job-source=update job_source set last_run_at = ?, last_ok_at = ?, last_error = null, fails = 0, jobs = ? where id = ?
sql.job-radar-service.refresh-source.update-job-source-2=update job_source set last_run_at = ?, last_error = ?, fails = fails + 1, enabled = case when fails + 1 >= 5 then false else enabled end where id = ?
sql.job-radar-service.claim-due-boards.update-job-source=update job_source set last_run_at = now() where id in (select id from job_source where enabled and (last_run_at is null or last_run_at < now() - interval '6 hours') \
    order by last_run_at nulls first limit ? for update skip locked) returning id
sql.job-radar-service.purge-closed.delete-job-listing=delete from job_listing where closed_at < now() - interval '30 days' and id not in (select job_id from student_job_state)
sql.job-radar-service.refresh-due=select id from job_source where enabled and (last_run_at is null or last_run_at < now() - interval '6 hours') order by last_run_at nulls first limit ?
sql.job-radar-service.refresh-due.delete-job-listing=delete from job_listing where closed_at < now() - interval '30 days' and id not in (select job_id from student_job_state)
sql.job-radar-service.companies=select s.id, s.company, s.ats, s.token, s.last_ok_at, s.last_error, s.origin from student_job_follow f join job_source s on s.id = f.source_id \
    where f.owner_id = ? order by s.company
sql.job-radar-service.companies-2=select org, count(*) from ( \
    select to_org as org from student_mail where owner_id = ? and to_org is not null and to_org <> '' \
    union all select org from student_contact where owner_id = ? and org is not null and org <> '') x \
    group by org order by 2 desc limit 40
sql.job-radar-service.add-company=select count(*) from student_job_follow where owner_id = ?
sql.job-radar-service.add-company-2=select id from job_source where ats = ? and lower(token) = lower(?) and enabled and jobs > 0
sql.job-radar-service.add-company-3=select count(*) from job_source where added_by = ? and created_at > now() - interval '1 day'
sql.job-radar-service.add-company.insert-job-source=insert into job_source(id, ats, token, company, enabled, added_by, created_at, origin) values (?, ?, ?, ?, true, ?, now(), 'student')
sql.job-radar-service.add-company-4=select id from job_source where ats = ? and lower(token) = lower(?)
sql.job-radar-service.add-company.update-job-source=update job_source set enabled = true, fails = 0 where id = ?
sql.job-radar-service.follow.insert-student-job-follow=insert into student_job_follow(owner_id, source_id, created_at) values (?, ?, now()) on conflict do nothing
sql.job-radar-service.follow-source=select count(*) from job_source where id = ?
sql.job-radar-service.follow-source-2=select count(*) from student_job_follow where owner_id = ?
sql.job-radar-service.follow-source.insert-student-job-follow=insert into student_job_follow(owner_id, source_id, created_at) values (?, ?, now()) on conflict do nothing
sql.job-radar-service.unfollow.delete-student-job-follow=delete from student_job_follow where owner_id = ? and source_id = ?
sql.job-radar-service.inbox=select inbox_on, inbox_last_scan, inbox_error, inbox_stats from student_job_prefs where owner_id = ?
sql.job-radar-service.set-inbox.insert-student-job-prefs=insert into student_job_prefs(owner_id, inbox_on, inbox_at, updated_at) values (?, ?, now(), now()) \
    on conflict (owner_id) do update set inbox_on = excluded.inbox_on, inbox_at = now(), inbox_error = null, updated_at = now()
sql.job-radar-service.set-inbox.update-student-job-prefs=update student_job_prefs set inbox_uids = null, inbox_last_scan = null, inbox_scan_state = null, inbox_scan_progress = null, inbox_scan_history = null where owner_id = ?
sql.job-radar-service.set-inbox.update-job-listing=update job_listing set closed_at = now() where owner_id = ? and kind = 'alert' and closed_at is null and id not in (select job_id from student_job_state where owner_id = ?)
sql.job-radar-service.start-scan=select inbox_on from student_job_prefs where owner_id = ?
sql.job-radar-service.stop-scan.update-student-job-prefs=update student_job_prefs set inbox_scan_state = 'stopping' where owner_id = ? and inbox_scan_state = 'running'
sql.job-radar-service.scan-status=select inbox_scan_state, coalesce(inbox_scan_beat, inbox_scan_started), inbox_scan_progress from student_job_prefs where owner_id = ?
sql.job-radar-service.scan-history=select inbox_scan_history, inbox_last_scan, inbox_on from student_job_prefs where owner_id = ?
sql.job-radar-service.save.update-student-job-prefs=update student_job_prefs set inbox_scan_progress = ?, inbox_scan_beat = now() where owner_id = ? and inbox_scan_state in ('running', 'stopping')
sql.job-radar-service.stopping=select inbox_scan_state from student_job_prefs where owner_id = ?
sql.job-radar-service.end.update-student-job-prefs=update student_job_prefs set inbox_scan_state = ?, inbox_scan_progress = ? where owner_id = ?
sql.job-radar-service.history.update-student-job-prefs=update student_job_prefs set inbox_scan_history = ? where owner_id = ?
sql.job-radar-service.scan=select inbox_last_scan, inbox_uids from student_job_prefs where owner_id = ?
sql.job-radar-service.scan.update-student-job-prefs=update student_job_prefs set inbox_uids = ? where owner_id = ?
sql.job-radar-service.scan-2=select source, count(*) from job_listing where owner_id = ? and kind = 'alert' and closed_at is null group by 1 order by 2 desc
sql.job-radar-service.scan.update-student-job-prefs-2=update student_job_prefs set inbox_last_scan = ?, inbox_error = null, inbox_stats = ?, inbox_uids = ? where owner_id = ?
sql.job-radar-service.scan.update-student-job-prefs-3=update student_job_prefs set inbox_error = ? where owner_id = ?
sql.job-radar-service.scan.update-student-job-prefs-4=update student_job_prefs set inbox_error = ? where owner_id = ?
sql.job-radar-service.scan-one-due.update-student-job-prefs=update student_job_prefs set inbox_error = 'Your plan no longer includes job alerts from your inbox.', inbox_last_scan = now() where owner_id = ?
sql.job-radar-service.scan-one-due.update-student-job-prefs-2=update student_job_prefs set inbox_last_scan = now() where owner_id = ?

# ---------------------------------------------------------------- PulseService
sql.pulse-service.create-table.student-pulse-resume=create table if not exists student_pulse_resume ( \
    owner_id varchar(40) primary key, file_name varchar(200) not null, stored_name varchar(80) not null, size int not null, \
    display_name varchar(80), headline varchar(140), auto_link boolean not null default true, \
    created_at timestamptz not null, updated_at timestamptz not null)
sql.pulse-service.create-table.student-pulse-link=create table if not exists student_pulse_link ( \
    token varchar(24) primary key, owner_id varchar(40) not null, email varchar(254) not null, name varchar(120), \
    created_at timestamptz not null, last_sent_at timestamptz, mails int not null default 0, \
    sessions int not null default 0, seconds int not null default 0, devices int not null default 0, downloads int not null default 0, \
    first_view_at timestamptz, last_view_at timestamptz, last_beat_at timestamptz, \
    response varchar(16), response_note varchar(500), response_at timestamptz)
sql.pulse-service.create-index.ux-pulse-link-owner-email=create unique index if not exists ux_pulse_link_owner_email on student_pulse_link(owner_id, email)
sql.pulse-service.create-index.ix-pulse-link-owner-seen=create index if not exists ix_pulse_link_owner_seen on student_pulse_link(owner_id, last_view_at desc)
sql.pulse-service.create-table.student-pulse-view=create table if not exists student_pulse_view ( \
    id varchar(24) primary key, token varchar(24) not null, owner_id varchar(40) not null, device varchar(16) not null, \
    mobile boolean not null default false, started_at timestamptz not null, last_beat_at timestamptz not null, \
    seconds int not null default 0, downloaded boolean not null default false, ip_hash varchar(16))
sql.pulse-service.create-index.ix-pulse-view-token=create index if not exists ix_pulse_view_token on student_pulse_view(token, started_at desc)
sql.pulse-service.create-index.ix-pulse-view-owner=create index if not exists ix_pulse_view_owner on student_pulse_view(owner_id, started_at desc)
sql.pulse-service.overview=select count(*) links, count(*) filter (where sessions > 0) opened, coalesce(sum(seconds), 0) secs, \
    count(*) filter (where devices >= 2) fwd, coalesce(sum(downloads), 0) dls, count(*) filter (where response is not null) resp, \
    count(*) filter (where last_beat_at > ?) live \
    from student_pulse_link where owner_id = ?
sql.pulse-service.overview-2=select * from student_pulse_link where owner_id = ? \
    order by (sessions > 0) desc, coalesce(last_view_at, last_sent_at, created_at) desc limit 300
sql.pulse-service.feed=select v.token, v.started_at, v.seconds, v.mobile, v.downloaded, v.last_beat_at > ? live, l.name, l.email, \
    (select count(*) from student_pulse_view x where x.token = v.token and x.started_at < v.started_at) earlier, \
    (select count(*) from student_pulse_view x where x.token = v.token and x.device = v.device and x.started_at < v.started_at) same \
    from student_pulse_view v join student_pulse_link l on l.token = v.token \
    where v.owner_id = ? order by v.started_at desc limit 40
sql.pulse-service.feed-2=select token, name, email, response, response_note, response_at from student_pulse_link \
    where owner_id = ? and response_at is not null order by response_at desc limit 15
sql.pulse-service.sessions=select count(*) from student_pulse_link where token = ? and owner_id = ?
sql.pulse-service.sessions-2=select id, device, mobile, started_at, last_beat_at, seconds, downloaded from student_pulse_view \
    where token = ? and owner_id = ? order by started_at asc limit 200
sql.pulse-service.upload.insert-student-pulse-resume=insert into student_pulse_resume(owner_id, file_name, stored_name, size, display_name, headline, auto_link, created_at, updated_at) values (?, ?, ?, ?, ?, null, true, ?, ?)
sql.pulse-service.upload.update-student-pulse-resume=update student_pulse_resume set file_name = ?, stored_name = ?, size = ?, updated_at = ? where owner_id = ?
sql.pulse-service.settings.update-student-pulse-resume=update student_pulse_resume set display_name = ?, headline = ?, auto_link = ?, updated_at = ? where owner_id = ?
sql.pulse-service.remove-resume.delete-student-pulse-resume=delete from student_pulse_resume where owner_id = ?
sql.pulse-service.link-for.insert-student-pulse-link=insert into student_pulse_link(token, owner_id, email, name, created_at, mails) values (?, ?, ?, ?, ?, 0) \
    on conflict (owner_id, email) do update set name = coalesce(excluded.name, student_pulse_link.name) \
    returning token
sql.pulse-service.sent.update-student-pulse-link=update student_pulse_link set mails = mails + 1, last_sent_at = ? where owner_id = ? and email = ?
sql.pulse-service.open=select count(*) from student_pulse_view where token = ? and started_at > ?
sql.pulse-service.open.insert-student-pulse-view=insert into student_pulse_view(id, token, owner_id, device, mobile, started_at, last_beat_at, seconds, ip_hash) values (?,?,?,?,?,?,?,0,?)
sql.pulse-service.open.update-student-pulse-link=update student_pulse_link set sessions = sessions + 1, first_view_at = coalesce(first_view_at, ?), last_view_at = ?, last_beat_at = ?, \
    devices = (select count(distinct device) from student_pulse_view where token = ?) where token = ?
sql.pulse-service.open-2=select devices from student_pulse_link where token = ?
sql.pulse-service.beat=select last_beat_at, seconds, started_at from student_pulse_view where id = ? and token = ? for update
sql.pulse-service.beat.update-student-pulse-view=update student_pulse_view set seconds = seconds + ?, last_beat_at = ? where id = ?
sql.pulse-service.beat.update-student-pulse-link=update student_pulse_link set seconds = seconds + ?, last_beat_at = ? where token = ?
sql.pulse-service.downloaded.update-student-pulse-view=update student_pulse_view set downloaded = true where id = ? and token = ? and downloaded = false
sql.pulse-service.downloaded.update-student-pulse-link=update student_pulse_link set downloads = downloads + 1 where token = ?
sql.pulse-service.respond.update-student-pulse-link=update student_pulse_link set response = ?, response_note = ?, response_at = ? where token = ?
sql.pulse-service.briefs=select * from student_pulse_link where owner_id = ? and (sessions > 0 or response is not null)
sql.pulse-service.link=select * from student_pulse_link where token = ?
sql.pulse-service.resume-row=select * from student_pulse_resume where owner_id = ?
sql.pulse-service.resume-of=select token from student_pulse_link where owner_id = ? order by created_at desc limit 1

# ---------------------------------------------------------------- HrRadarService
sql.hr-radar-service.create-table.hr-radar=create table if not exists hr_radar (k varchar(40) primary key, kind char(1) not null, hist real[] not null, delay real[] not null, sends real not null default 0, opens real not null default 0, senders varchar(160), updated_at timestamptz not null default now())
sql.hr-radar-service.init=select count(*) from hr_radar where k = 'meta:backfill'
sql.hr-radar-service.backfill=select id, owner_id, lower(to_email) e, sent_at, opened_at from student_mail where status in ('sent', 'opened') and sent_at is not null and id > ? order by id limit 5000
sql.hr-radar-service.backfill.insert-hr-radar=insert into hr_radar (k, kind, hist, delay) values ('meta:backfill', 'm', '{}', '{}') on conflict do nothing
sql.hr-radar-service.decay.update-hr-radar=update hr_radar set hist = (select array_agg(v * ? order by i) from unnest(hist) with ordinality u(v, i)), delay = (select array_agg(v * ? order by i) from unnest(delay) with ordinality u(v, i)), sends = sends * ?, opens = opens * ? where kind <> 'm'
sql.hr-radar-service.decay.delete-hr-radar=delete from hr_radar where kind <> 'm' and opens < 0.2 and sends < 0.5
sql.hr-radar-service.row=select hist, delay, sends, opens, senders from hr_radar where k = ?
sql.hr-radar-service.with-me=select senders from hr_radar where k = ?

# ---------------------------------------------------------------- StudentContactRepository
jpa.StudentContact.search=select c from StudentContact c where c.ownerId = :owner and (:q = '' or lower(concat(coalesce(c.name,''),' ',c.email,' ',coalesce(c.org,''),' ',coalesce(c.role,''))) like concat('%', :q, '%')) order by c.createdAt desc
jpa.StudentContact.deleteAllOfOwner=delete from StudentContact c where c.ownerId = :owner

# ---------------------------------------------------------------- StudentImportRepository
jpa.StudentImport.activeIds=select i.id from StudentImport i where i.ownerId = :owner and i.status in :statuses

# ---------------------------------------------------------------- StudentMailRepository
jpa.StudentMail.countSentSince=select count(m) from StudentMail m where m.ownerId = :owner and (m.sentAt >= :since or m.status = 'sending')
jpa.StudentMail.lockDue=select * from student_mail where status = 'scheduled' and send_at <= :now order by send_at limit :n for update skip locked
jpa.StudentMail.countScheduledBefore=select count(m) from StudentMail m where m.ownerId = :owner and m.status = 'scheduled' and m.sendAt < :before
jpa.StudentMail.nextDueAtFor=select min(m.sendAt) from StudentMail m where m.ownerId = :owner and m.status = 'scheduled'
jpa.StudentMail.nextDueAt=select min(m.sendAt) from StudentMail m where m.status = 'scheduled'
jpa.StudentMail.lockStuck=select * from student_mail where status = 'sending' and locked_until < :now limit 50 for update skip locked
jpa.StudentMail.sentForTracker=select id, lower(to_email), to_name, to_org, to_role, subject, sent_at, opened_at, message_id, category from student_mail where owner_id = :owner and status in ('sent', 'opened') and sent_at is not null order by sent_at
jpa.StudentMail.pendingFollowUps=select lower(to_email), min(send_at) from student_mail where owner_id = :owner and status in ('scheduled', 'sending') and in_reply_to is not null and coalesce(category, '') <> 'thank_you' group by 1
jpa.StudentMail.sentPerWeek=select cast(date_trunc('week', sent_at at time zone 'Asia/Kolkata') as date), count(*) from student_mail where owner_id = :owner and status in ('sent', 'opened') and coalesce(category, '') not in ('follow_up', 'thank_you') and sent_at >= :from group by 1 order by 1
jpa.StudentMail.sentDays=select distinct cast(sent_at at time zone 'Asia/Kolkata' as date) d from student_mail where owner_id = :owner and status in ('sent', 'opened') and sent_at >= :from order by d desc
jpa.StudentMail.thankYous=select lower(to_email), max(created_at) from student_mail where owner_id = :owner and category = 'thank_you' and status in ('scheduled', 'sending', 'sent', 'opened', 'paused') group by 1

# ---------------------------------------------------------------- HuntInsightsService
sql.hunt-insights-service.build=select distinct on (lower(to_email)) lower(to_email), sent_at, opened_at, template from student_mail where owner_id = ? and status in ('sent', 'opened') and sent_at is not null and coalesce(category, '') not in ('follow_up', 'thank_you') order by lower(to_email), sent_at
sql.hunt-insights-service.build-2=select lower(to_email), min(sent_at) from student_mail where owner_id = ? and status in ('sent', 'opened') and category = 'follow_up' group by 1

# ---------------------------------------------------------------- InterviewService
sql.interview-service.create-table.student-iv-debrief=create table if not exists student_iv_debrief ( \
    id varchar(24) primary key, owner_id varchar(40) not null, app_id varchar(40) not null, round_at timestamptz not null, \
    feel smallint, went_well varchar(1000), improve varchar(1000), questions text, \
    created_at timestamptz not null, updated_at timestamptz not null)
sql.interview-service.create-index.ux-iv-debrief-round=create unique index if not exists ux_iv_debrief_round on student_iv_debrief(owner_id, app_id, round_at)
sql.interview-service.create-index.ix-iv-debrief-owner=create index if not exists ix_iv_debrief_owner on student_iv_debrief(owner_id, round_at desc)
sql.interview-service.for-card=select * from student_iv_debrief where owner_id = ? and app_id = ? order by round_at desc
sql.interview-service.save.update-student-iv-debrief=update student_iv_debrief set feel = ?, went_well = ?, improve = ?, questions = ?, updated_at = ? where owner_id = ? and app_id = ? and round_at = ?
sql.interview-service.save.insert-student-iv-debrief=insert into student_iv_debrief(id, owner_id, app_id, round_at, feel, went_well, improve, questions, created_at, updated_at) values (?,?,?,?,?,?,?,?,?,?)
sql.interview-service.save=select id from student_iv_debrief where owner_id = ? and app_id = ? and round_at = ?
sql.interview-service.bank=select count(*) n, avg(feel) f from student_iv_debrief where owner_id = ?
sql.interview-service.rounds=select app_id, round_at from student_iv_debrief where owner_id = ?
sql.interview-service.bank-items=select d.app_id, a.org, d.round_at, d.questions from student_iv_debrief d left join student_application a on a.id = d.app_id where d.owner_id = ? and d.questions is not null and d.questions <> '[]' order by d.round_at desc

# ---------------------------------------------------------------- BizMetrics (business analytics over biz_message)
# {where}: the scope below, built by code; {a}: "" or "m." (the table alias); {column}: one of a fixed list in code
sql.biz-metrics.where=where {a}owner_id = :owner and {a}created_at >= :from and {a}created_at < :to
sql.biz-metrics.where.channel=and {a}channel = :channel
sql.biz-metrics.where.env=and {a}env = :env
sql.biz-metrics.where.source=and {a}source = :source
sql.biz-metrics.total=select status, count(*), coalesce(sum(cost_paise),0), coalesce(sum(latency_ms),0), count(latency_ms) \
    from biz_message {where} group by status
sql.biz-metrics.daily=select cast(date_trunc('day', created_at at time zone 'Asia/Kolkata') as date), status, count(*), \
    coalesce(sum(cost_paise),0), coalesce(sum(latency_ms),0), count(latency_ms) from biz_message {where} group by 1, 2
sql.biz-metrics.buckets=select floor(extract(epoch from created_at) / :step) * :step, status, count(*) from biz_message {where} group by 1, 2
sql.biz-metrics.by=select {column}, status, count(*), coalesce(sum(cost_paise),0), coalesce(sum(latency_ms),0), count(latency_ms) \
    from biz_message {where} group by 1, 2 order by 3 desc
sql.biz-metrics.open-heatmap=select extract(isodow from opened_at at time zone 'Asia/Kolkata'), extract(hour from opened_at at time zone 'Asia/Kolkata'), count(*) \
    from biz_message {where} and opened_at is not null group by 1, 2
sql.biz-metrics.by-city=select coalesce(nullif(c.city, ''), 'Unknown'), m.status, count(*) \
    from biz_message m left join biz_contact c on c.id = m.contact_id {where} group by 1, 2
# BizAnalyticsService: open rate by weekday x hour sent ({channel}: the line below, or nothing)
sql.biz-analytics-service.heatmap=select extract(isodow from created_at at time zone 'Asia/Kolkata'), extract(hour from created_at at time zone 'Asia/Kolkata'), count(*), count(opened_at) \
    from biz_message where owner_id = :o and created_at >= :f and created_at < :t and env = 'live' and status in ('delivered','opened','clicked') {channel} \
    group by 1, 2
sql.biz-analytics-service.heatmap.channel=and channel = :c

# ---------------------------------------------------------------- CompanyConsoleService: the company's API request logs
# {where}: built by code from the lines below (each filter only when it is set)
sql.company-console.logs.where=where owner_id = :o and source = 'api'
sql.company-console.logs.where.env=and env = :env
sql.company-console.logs.where.channel=and channel = :ch
sql.company-console.logs.where.search=and (lower(id) like :q or lower(to_address) like :q or lower(coalesce(source_name,'')) like :q or lower(coalesce(error_code,'')) like :q)
sql.company-console.logs.where.success=and status in ('delivered','opened','clicked')
sql.company-console.logs.where.failed=and status in ('failed','bounced','suppressed')
sql.company-console.logs.where.queued=and status in ('queued','sending','paused')
sql.company-console.logs.counts=select status, count(*) from biz_message {where} group by status
sql.company-console.logs.page=select * from biz_message {where} order by created_at desc
sql.company-console.logs.total=select count(*) from biz_message {where}

# ---------------------------------------------------------------- BizLogsService: Delivery logs (filters, counts, histogram)
# {where}: built by code from the lines below (each filter only when it is set)
sql.biz-logs-service.where=where owner_id = :owner and created_at >= :from and created_at < :to and env = :env
sql.biz-logs-service.where.api-key=and api_key_id = :key
sql.biz-logs-service.where.channel=and channel = :channel
sql.biz-logs-service.where.source=and source_id = :source
sql.biz-logs-service.where.provider=and provider_name = :provider
sql.biz-logs-service.where.error=and error_code = :error
sql.biz-logs-service.where.search=and (lower(id) like :q or lower(to_address) like :q or lower(coalesce(contact_name,'')) like :q \
    or lower(coalesce(source_name,'')) like :q or lower(coalesce(subject,'')) like :q or lower(coalesce(error_code,'')) like :q)
sql.biz-logs-service.where.problems=and status in ('failed','bounced','suppressed')
sql.biz-logs-service.where.queued=and status in ('queued','sending','paused')
sql.biz-logs-service.where.failed=and status in ('failed','suppressed')
sql.biz-logs-service.where.status=and status = :status
sql.biz-logs-service.counts=select status, count(*) from biz_message {where} group by status
sql.biz-logs-service.page=select * from biz_message {where} order by created_at desc, id desc
sql.biz-logs-service.total=select count(*) from biz_message {where}
sql.biz-logs-service.histogram=select floor((extract(epoch from created_at) - :hfrom) / :hstep), status, count(*) from biz_message {where} group by 1, 2
sql.biz-logs-service.errors=select error_code, count(*), string_agg(distinct channel, ',') from biz_message {where} \
    and error_code is not null and status in ('failed','bounced','suppressed') group by 1 order by 2 desc
sql.biz-logs-service.stats=select coalesce(avg(latency_ms), 0), \
    coalesce(sum(case when status in ('delivered','opened','clicked','bounced') then cost_paise else 0 end), 0) from biz_message {where}
sql.biz-logs-service.sources=select source_id, max(source_name), max(source), max(channel) from biz_message {where} \
    and source_id is not null group by 1 order by 2 limit 100

# ---------------------------------------------------------------- statements with {parts} (names / ?-lists chosen by code, never user input)
# EnumCheckRepair: keep a status column's check constraint in step with the Java enum
sql.enum-check-repair.drop-check=alter table {table} drop constraint if exists {constraint}
sql.enum-check-repair.add-check=alter table {table} add constraint {constraint} check ({column} is null or {column} in ({allowed}))
# OwnerDataEraser: one table that holds the owner's rows ({table}, {column}: quoted names read from the database)
sql.owner-data-eraser.delete-owner-rows=delete from {table} where {column} = ?
# PlatformStatsService: mails sent per day (IST), by kind; {in}: one ? per "sent" status
sql.platform-stats-service.sent-by-day=select (sent_at at time zone 'Asia/Kolkata')::date d, case when source = 'api' then 2 else 1 end k, count(*) n \
    from biz_message where status in ({in}) and sent_at >= ? group by 1, 2
# MeService: the home page numbers ("sent" = delivered, opened or clicked)
sql.me-service.product.sent=select count(*) from biz_message where owner_id = ? and source <> 'api' and status in ('delivered','opened','clicked') and sent_at >= ?
sql.me-service.product.sent-before=select count(*) from biz_message where owner_id = ? and source <> 'api' and status in ('delivered','opened','clicked') \
    and sent_at >= ? and sent_at < ?
sql.me-service.company.delivered=select count(*) from biz_message where owner_id = ? and source = 'api' and env = 'live' \
    and status in ('delivered','opened','clicked') and created_at >= ?
sql.me-service.activity.product=select (coalesce(sent_at, created_at) at time zone 'Asia/Kolkata')::date d, count(*) n from biz_message \
    where owner_id = ? and source <> 'api' and coalesce(sent_at, created_at) >= ? group by 1
sql.me-service.activity.company=select (coalesce(sent_at, created_at) at time zone 'Asia/Kolkata')::date d, count(*) n from biz_message \
    where owner_id = ? and source = 'api' and coalesce(sent_at, created_at) >= ? group by 1
# ProviderMigration: mark an old business provider row as moved / unreadable (kind = provider_migrated | provider_unreadable)
sql.provider-migration.business-providers.mark=update biz_doc set kind = ? where id = ?

# ---------------------------------------------------------------- OnboardingSignals: when each getting-started step first happened
# one statement per signal: min(time) from the table for the owner (?); the asked ones are joined with "union all"
sql.onboarding-signals.gmail-connected=select 'gmail_connected' as signal, min(connected_at) as at from provider where tenant_id = ? and owner_type = 'STUDENT' and status = 'connected'
sql.onboarding-signals.student-contacts=select 'student_contacts' as signal, min(created_at) as at from student_contact where owner_id = ?
sql.onboarding-signals.student-template=select 'student_template' as signal, min(to_timestamp(created_at / 1000.0)) as at from template where tenant_id = ? and owner_type = 'STUDENT'
sql.onboarding-signals.student-first-send=select 'student_first_send' as signal, min(coalesce(sent_at, send_at)) as at from student_mail where owner_id = ? and status in ('sent', 'opened')
sql.onboarding-signals.provider-connected=select 'provider_connected' as signal, min(connected_at) as at from provider where tenant_id = ? and owner_type in ('PRODUCT', 'COMPANY')
sql.onboarding-signals.biz-contacts=select 'biz_contacts' as signal, min(created_at) as at from biz_contact where owner_id = ?
sql.onboarding-signals.biz-template=select 'biz_template' as signal, min(to_timestamp(created_at / 1000.0)) as at from template where tenant_id = ? and owner_type in ('PRODUCT', 'COMPANY')
sql.onboarding-signals.biz-first-campaign=select 'biz_first_campaign' as signal, min(created_at) as at from biz_campaign where owner_id = ? and status <> 'draft'
sql.onboarding-signals.test-mail-sent=select 'test_mail_sent' as signal, min(test_mail_at) as at from onboarding_state where owner_id = ? and test_mail_at is not null
sql.onboarding-signals.test-key=select 'test_key' as signal, min(created_at) as at from biz_api_key where owner_id = ? and env = 'test'
sql.onboarding-signals.test-call=select 'test_call' as signal, min(created_at) as at from biz_message where owner_id = ? and source = 'api' and env = 'test'
sql.onboarding-signals.webhook=select 'webhook' as signal, min(created_at) as at from biz_doc where owner_id = ? and kind = 'webhook'
sql.onboarding-signals.live-key=select 'live_key' as signal, min(created_at) as at from biz_api_key where owner_id = ? and env = 'live' and revoked_at is null
# TriggerUsage: API sends per template / provider ({column}: a fixed expression from code)
sql.trigger-usage.by-day=select {column} k, to_char(to_timestamp(created_at / 1000.0) at time zone 'Asia/Kolkata', 'YYYY-MM-DD') d, \
    count(*) filter (where status = 'SUCCESS') ok, count(*) filter (where status <> 'SUCCESS') bad, max(created_at) last \
    from notification_log where tenant_id = ? and created_at >= ? and {column} is not null group by 1, 2
sql.trigger-usage.split=select {column} k, count(*) filter (where status = 'SUCCESS') ok, count(*) filter (where status <> 'SUCCESS') bad \
    from notification_log where tenant_id = ? and created_at >= ? group by 1 order by count(*) desc limit 12
# JobAutopilotService: who is due (every ? minutes, at most ? people), "already wrote to them" checks (? days), runs
sql.job-autopilot-service.claim-due=update student_autopilot set last_run_at = now() where owner_id in ( \
    select owner_id from student_autopilot where enabled and (last_run_at is null or last_run_at < now() - (? * interval '1 minute')) \
    order by last_run_at nulls first limit ? for update skip locked) returning owner_id
sql.job-autopilot-service.run-due=select owner_id from student_autopilot where enabled \
    and (last_run_at is null or last_run_at < now() - (? * interval '1 minute')) order by last_run_at nulls first limit ?
sql.job-autopilot-service.blocked.same-person=select max(coalesce(sent_at, send_at)) from student_mail where owner_id = ? and lower(to_email) = lower(?) \
    and coalesce(sent_at, send_at) > now() - (? * interval '1 day')
sql.job-autopilot-service.blocked.same-company=select title, created_at from job_autopilot_run where owner_id = ? and lower(company) = lower(?) and status = 'queued' \
    and created_at > now() - (? * interval '1 day') and id <> coalesce(?, '') order by created_at desc limit 1
sql.job-autopilot-service.approve-all.review=select id, job_id, company, title, url, match, to_email, to_name, contact_from, status, why, subject, body, send_at, \
    send_label, time_source, mail_id, manual, created_at from job_autopilot_run where owner_id = ? and status = 'review' order by match desc limit 50
sql.job-autopilot-service.for-job.existing=select id, job_id, company, title, url, match, to_email, to_name, contact_from, status, why, subject, body, send_at, \
    send_label, time_source, mail_id, manual, created_at from job_autopilot_run where owner_id = ? and job_id = ?
sql.job-autopilot-service.run-row=select id, job_id, company, title, url, match, to_email, to_name, contact_from, status, why, subject, body, send_at, \
    send_label, time_source, mail_id, manual, created_at from job_autopilot_run where id = ? and owner_id = ?
sql.job-autopilot-service.runs=select a.id, a.job_id, a.company, a.title, a.url, a.match, a.to_email, a.to_name, a.contact_from, a.status, a.why, a.subject, a.body, a.send_at, \
    a.send_label, a.time_source, a.mail_id, a.manual, a.created_at, m.status, m.sent_at, m.opened_at, m.id \
    from job_autopilot_run a left join student_mail m on m.id = a.mail_id \
    where a.owner_id = ? order by a.created_at desc, a.match desc limit ?
# JobRadarService: listings (the 23 columns row() reads, in this order), the scan claim (stale after ? seconds), due scans
sql.job-radar-service.scored.listings=select id, kind, source, owner_id, dedupe_key, company, title, location, city, remote, work_type, team, exp_min, exp_max, \
    salary, url, description, deadline, posted_at, first_seen_at, last_seen_at, source_id, contact_email \
    from job_listing where closed_at is null and (owner_id is null or owner_id = ?) and last_seen_at > ? order by last_seen_at desc limit ?
sql.job-radar-service.listing=select id, kind, source, owner_id, dedupe_key, company, title, location, city, remote, work_type, team, exp_min, exp_max, \
    salary, url, description, deadline, posted_at, first_seen_at, last_seen_at, source_id, contact_email \
    from job_listing where id = ? and (owner_id is null or owner_id = ?)
sql.job-radar-service.upsert.insert-job-listing=insert into job_listing(id, kind, source, owner_id, dedupe_key, company, title, location, city, remote, work_type, team, \
    exp_min, exp_max, salary, url, description, deadline, posted_at, first_seen_at, last_seen_at, source_id, contact_email, ext_id, closed_at) \
    values (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, null)
sql.job-radar-service.claim-scan=update student_job_prefs set inbox_scan_state = 'running', inbox_scan_started = now(), inbox_scan_beat = now(), inbox_scan_progress = ? \
    where owner_id = ? and not (coalesce(inbox_scan_state, '') in ('running', 'stopping') \
    and coalesce(inbox_scan_beat, inbox_scan_started) > now() - (? * interval '1 second'))
sql.job-radar-service.due-scans=select owner_id from student_job_prefs where inbox_on \
    and (inbox_last_scan is null or inbox_last_scan < now() - interval '3 hours') \
    and not (coalesce(inbox_scan_state, '') in ('running', 'stopping') and coalesce(inbox_scan_beat, inbox_scan_started) > now() - (? * interval '1 second')) \
    order by inbox_last_scan nulls first limit ?
# HrRadarService: add one open / send to a recruiter's habits (hist and delay arrays add up; senders: the union, capped at ? names)
sql.hr-radar-service.apply=insert into hr_radar (k, kind, hist, delay, sends, opens, senders, updated_at) \
    values (?, ?, ?::real[], ?::real[], ?, ?, nullif(?, ''), now()) on conflict (k) do update set \
    hist = (select array_agg(coalesce(x, 0) + coalesce(y, 0) order by i) from unnest(hr_radar.hist, excluded.hist) with ordinality u(x, y, i)), \
    delay = (select array_agg(coalesce(x, 0) + coalesce(y, 0) order by i) from unnest(hr_radar.delay, excluded.delay) with ordinality u(x, y, i)), \
    sends = hr_radar.sends + excluded.sends, opens = hr_radar.opens + excluded.opens, \
    senders = (select string_agg(s, ',') from (select distinct s from unnest(string_to_array(concat_ws(',', hr_radar.senders, excluded.senders), ',')) s \
    where s <> '' limit ?) z), updated_at = now()
# health pings, table check, and the leader lock ({key}: a number from code)
sql.health-service.ping=select 1
sql.provider-migration.table-exists=select to_regclass(?) is not null
sql.cluster-leader.ping=select 1
sql.cluster-leader.try-lock=select pg_try_advisory_lock({key})
sql.cluster-leader.unlock=select pg_advisory_unlock({key})
