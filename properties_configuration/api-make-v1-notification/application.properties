# =====================================================================================================
#  QuickNotify · notification service (mails, campaigns, contacts, templates, automations, scheduler)
#  THE ONE PLACE for this service's settings: database, Kafka, Elasticsearch, EMQX, limits, logging...
#  Read at start-up (the service does not start without it) and again every 60 s: most changes apply
#  WITHOUT a restart. Keys marked (restart) are read only at start: ./deploy.sh restart notification
#
#  PUBLIC REPO: secrets are NEVER written here. ${NAME} = filled from the server's deploy/.env or
#  deploy/config/notification.env when the service starts (JWT_SECRET, POSTGRES_PASSWORD, keys, tokens).
#  Addresses (postgres, kafka, ...) are the Docker service names from deploy/docker-compose.yml.
# =====================================================================================================

# ---------------------------------------------------------------- service
server.port=8080
server.servlet.context-path=/notification
spring.main.allow-circular-references=true
spring.http.converters.preferred-json-mapper=jackson2
spring.output.ansi.enabled=never
# the web app's address (links inside mails, open-tracking images) - from deploy/.env PUBLIC_URL
app.public-url=${PUBLIC_URL:http://localhost:3000}
cors.allowed-origins=${PUBLIC_URL:http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ---------------------------------------------------------------- database: PostgreSQL (restart)
spring.datasource.url=jdbc:postgresql://postgres:5432/qn_notification
spring.datasource.username=${POSTGRES_USER:quicknotify}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=HikariPool-Notification
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------- Kafka (restart)
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.topic.name=notification
kafka.retry.max-attempts=3
kafka.retry.delay=1000

# ---------------------------------------------------------------- Elasticsearch: delivery logs + search (restart)
elasticsearch.enabled=true
elasticsearch.nodes=elasticsearch:9200
elasticsearch.scheme=http
elasticsearch.auth.enabled=false
elasticsearch.keep-alive-ms=30000
elasticsearch.index.name=notification-logs
notification.logging.db.enabled=true
notification.logging.elastic.enabled=true

# ---------------------------------------------------------------- EMQX / MQTT push (only with the "mqtt" profile) (restart)
emqx.broker.url=tcp://emqx:1883
emqx.auth.enabled=true

# ---------------------------------------------------------------- login tokens (made by the account manager, checked here)
jwt.secret=${JWT_SECRET}
jwt.issuer=quicknotify-account-manager
jwt.audience=quicknotify
# the account manager: session checks + the internal key both services share
app.account-manager.url=http://account-manager:8081/account
app.account-manager.internal-key=${INTERNAL_KEY}
app.auth.session-check=true
app.auth.session-check-ttl-ms=20000
app.auth.session-check-fail-closed=false
app.auth.user-paths=/api/v1/student/*,/api/v1/notifications,/api/v1/notifications/*,/api/v1/me/*,/api/v1/onboarding,/api/v1/onboarding/*,/api/v1/admin/*,/api/v1/biz/*
app.auth.public-paths=/api/v1/student/t/,/api/v1/biz/t/
app.legacy-api.enabled=false
tenant.ignore.paths=/api/v1/health
management.health.redis.enabled=false

# ---------------------------------------------------------------- delivery providers
# providers a paid plan may have when the plan itself doesn't say (applied live)
app.providers.paid-limit=25
# WhatsApp sign-in codes (Meta WhatsApp Cloud API). Number id + token come from deploy/config/notification.env
app.providers.platform-whatsapp.phone-number-id=${PLATFORM_WHATSAPP_PHONE_NUMBER_ID:}
app.providers.platform-whatsapp.access-token=${PLATFORM_WHATSAPP_ACCESS_TOKEN:}
app.providers.platform-whatsapp.display-number=${PLATFORM_WHATSAPP_DISPLAY_NUMBER:}
app.providers.platform-whatsapp.otp-template=quicknotify_login_code
app.providers.platform-whatsapp.template-language=en
app.providers.platform-whatsapp.api-base=https://graph.facebook.com/v21.0/
app.providers.platform-whatsapp.verify-on-start=true

# ---------------------------------------------------------------- job seekers (Gmail sending)
# encrypts saved Gmail app passwords (deploy/config/notification.env). NEVER change it after the first start.
student.crypto-key=${STUDENT_CRYPTO_KEY}
student.public-base-url=${PUBLIC_URL:http://localhost:3000}/notification
student.attachments-dir=/data/attachments
student.daily-limit=40
student.max-groups=20
student.max-group-size=10
student.max-attachment-bytes=10485760
# scheduled mails: how often the scheduler looks (ms), how many per round, tries (restart)
student.scheduler.delay-ms=30000
student.scheduler.batch-size=20
student.scheduler.lock-seconds=300
student.scheduler.max-attempts=3
# "Get started" test mail: how many one account may send per window (applied live)
app.onboarding.test-mail.per-window=5
app.onboarding.test-mail.window-minutes=10

# ---------------------------------------------------------------- business sending (restart)
biz.worker.delay-ms=1000
biz.worker.initial-delay-ms=1000
biz.worker.batch=100
biz.worker.max-attempts=4
biz.worker.threads=8
biz.campaigns.check-ms=20000
biz.campaigns.initial-delay-ms=20000
biz.automations.tick-ms=5000
biz.automations.initial-delay-ms=20000
# cost per message shown in analytics (paise)
biz.cost.email-paise=0
biz.cost.sms-paise=18
biz.cost.whatsapp-paise=35
biz.cost.push-paise=0
app.template-library.load-on-start=true
file.upload.max-size=50MB
file.upload.max-request-size=50MB

# ---------------------------------------------------------------- logs (deploy/logs/notification)
# levels: TRACE, DEBUG, INFO, WARN, ERROR (applied live)
logging.level.root=INFO
logging.level.com.make.application=INFO
logging.level.org.hibernate.SQL=WARN
# a service call slower than this is logged as a WARN (restart)
app.logging.slow-call-ms=1000
# files: a new part every file-size, kept max-days (restart)
app.logs.dir=/app/logs
app.logs.file-size=10MB
app.logs.max-days=14
app.logs.total-cap=1GB

# ---------------------------------------------------------------- health + metrics (Prometheus / Grafana) (restart)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=api-make-v1-notification
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
# Admin -> System: pause / resume / restart from the console
app.ops.restart-enabled=true

# ---------------------------------------------------------------- this file: read again every poll-seconds (restart)
app.config.poll-seconds=60
app.config.timeout-ms=5000
