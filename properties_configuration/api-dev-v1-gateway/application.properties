# =====================================================================================================
#  QuickNotify · API gateway
#  The gateway reads this file for its SQL only (read at start: restart the gateway after a change).
#  Its other settings come from its own application.yml (built in) and the server's deploy/.env; gateway
#  tunables (qn.tune.*) can be set there as environment variables, e.g. QN_TUNE_UPSTREAMS_TRIP_AFTER=8.
# =====================================================================================================

# =====================================================================================================
# SQL: every statement this service runs, by name (not in the Java code)
#   sql.<area>.<what>=...            run by code as Sql.q("<area>.<what>")
#   jpa.<Entity>.<method>=...        a repository method's query (JPQL; native SQL when the method says nativeQuery = true)
#   jpa.<Entity>.<method>.count=...  the count query of a paged method
# This file is also built into the jar (qn-config/application.properties), so a GitHub outage never breaks the
# queries. sql.* changes apply like the other settings (about a minute); jpa.* (repository) changes after a restart.
# Rules: values go in as ? / :name parameters, never into this text. {part} markers are filled by code from a fixed
# set (column names, ?-lists, filter lines), never from user input. A long statement continues on the next line
# with " \" at the end of the line. The unit test SqlCatalogTest fails when the code and this section disagree.
# =====================================================================================================
sql.gw.create-table.gw-rule=create table if not exists gw_rule ( \
    id varchar(64) primary key, name varchar(80) not null, description varchar(300), enabled boolean not null, \
    mode varchar(10) not null, paths varchar(1200) not null, methods varchar(60) not null, audience varchar(20) not null, \
    key_by varchar(20) not null, req_limit int not null, window_seconds int not null, burst int not null, \
    paid_multiplier numeric(6,2) not null default 1, sort_order int not null, built_in boolean not null, \
    updated_at timestamptz, updated_by varchar(120))
sql.gw.create-table.gw-ip-rule=create table if not exists gw_ip_rule ( \
    id bigserial primary key, cidr varchar(64) not null, action varchar(10) not null, reason varchar(300), \
    source varchar(10) not null, created_at timestamptz not null default now(), created_by varchar(120), \
    expires_at timestamptz, hits bigint not null default 0)
sql.gw.create-index.gw-ip-rule-exp=create index if not exists gw_ip_rule_exp on gw_ip_rule(expires_at)
sql.gw.create-table.gw-traffic-minute=create table if not exists gw_traffic_minute ( \
    minute timestamptz not null, upstream varchar(20) not null, requests int not null, ok int not null, client_errors int not null, \
    server_errors int not null, limited int not null, would_limit int not null, unauthorized int not null, blocked int not null, \
    unavailable int not null, p50_ms int not null, p95_ms int not null, max_ms int not null, primary key (minute, upstream))
sql.gw.create-table.gw-limited-key=create table if not exists gw_limited_key ( \
    minute timestamptz not null, rule_id varchar(64) not null, key_kind varchar(10) not null, key_value varchar(120) not null, \
    hits int not null, monitor boolean not null, primary key (minute, rule_id, key_value))
sql.gw.create-table.gw-change=create table if not exists gw_change ( \
    id bigserial primary key, at timestamptz not null default now(), admin_id varchar(64), admin_name varchar(120), \
    action varchar(40) not null, target varchar(120), detail varchar(1000), reason varchar(300))
sql.gw.create-table.gw-meta=create table if not exists gw_meta (k varchar(40) primary key, v varchar(200) not null)
sql.gw.ensure-ready.insert-gw-meta=insert into gw_meta(k, v) values ('version', '1') on conflict (k) do nothing
sql.gw.ensure-ready.insert-gw-rule=insert into gw_rule(id, name, description, enabled, mode, paths, methods, audience, key_by, req_limit, window_seconds, burst, \
    paid_multiplier, sort_order, built_in) values (?,?,?,?,?,?,?,?,?,?,?,?,?,?,true) on conflict (id) do nothing
sql.gw.ensure-ready.update-gw-rule=update gw_rule set name=?, description=?, mode=?, paths=?, methods=?, audience=?, key_by=?, req_limit=?, window_seconds=?, burst=?, \
    paid_multiplier=?, sort_order=? where id=? and built_in = true and updated_by is null \
    and (name<>? or description<>? or mode<>? or paths<>? or methods<>? or audience<>? or key_by<>? or req_limit<>? or window_seconds<>? \
    or burst<>? or paid_multiplier<>? or sort_order<>?)
sql.gw.version=select v from gw_meta where k = 'version'
sql.gw.bump.update-gw-meta=update gw_meta set v = (cast(v as bigint) + 1)::text where k = 'version'
sql.gw.rules=select * from gw_rule order by sort_order, name
sql.gw.rule=select * from gw_rule where id = ?
sql.gw.save-rule.update-gw-rule=update gw_rule set name=?, description=?, enabled=?, mode=?, paths=?, methods=?, audience=?, key_by=?, req_limit=?, window_seconds=?, \
    burst=?, paid_multiplier=?, sort_order=?, updated_at=case when cast(? as varchar) is null then null else now() end, updated_by=? where id=?
sql.gw.save-rule.insert-gw-rule=insert into gw_rule(id, name, description, enabled, mode, paths, methods, audience, key_by, req_limit, window_seconds, burst, \
    paid_multiplier, sort_order, built_in, updated_at, updated_by) values (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,now(),?)
sql.gw.delete-rule.delete-gw-rule=delete from gw_rule where id = ? and built_in = false
sql.gw.ip-rules=select * from gw_ip_rule where expires_at is null or expires_at > now() order by created_at desc limit 2000
sql.gw.add-ip-rule.delete-gw-ip-rule=delete from gw_ip_rule where cidr = ? and (expires_at is null or expires_at > now())
sql.gw.add-ip-rule.insert-gw-ip-rule=insert into gw_ip_rule(cidr, action, reason, source, created_by, expires_at) values (?,?,?,?,?,?) returning id
sql.gw.remove-ip-rule.delete-gw-ip-rule=delete from gw_ip_rule where id = ? returning *
sql.gw.add-hits.update-gw-ip-rule=update gw_ip_rule set hits = hits + ? where id = ?
sql.gw.add-minutes.insert-gw-traffic-minute=insert into gw_traffic_minute values (?,?,?,?,?,?,?,?,?,?,?,?,?,?) \
    on conflict (minute, upstream) do update set requests = gw_traffic_minute.requests + excluded.requests, \
    ok = gw_traffic_minute.ok + excluded.ok, client_errors = gw_traffic_minute.client_errors + excluded.client_errors, \
    server_errors = gw_traffic_minute.server_errors + excluded.server_errors, limited = gw_traffic_minute.limited + excluded.limited, \
    would_limit = gw_traffic_minute.would_limit + excluded.would_limit, unauthorized = gw_traffic_minute.unauthorized + excluded.unauthorized, \
    blocked = gw_traffic_minute.blocked + excluded.blocked, unavailable = gw_traffic_minute.unavailable + excluded.unavailable, \
    p50_ms = greatest(gw_traffic_minute.p50_ms, excluded.p50_ms), p95_ms = greatest(gw_traffic_minute.p95_ms, excluded.p95_ms), \
    max_ms = greatest(gw_traffic_minute.max_ms, excluded.max_ms)
sql.gw.minutes-since=select * from gw_traffic_minute where minute >= ? order by minute
sql.gw.add-limited.insert-gw-limited-key=insert into gw_limited_key values (?,?,?,?,?,?) \
    on conflict (minute, rule_id, key_value) do update set hits = gw_limited_key.hits + excluded.hits
sql.gw.top-limited=select rule_id, key_kind, key_value, sum(hits) as hits, bool_and(monitor) as monitor, max(minute) as last_at from gw_limited_key \
    where minute >= ? group by rule_id, key_kind, key_value order by sum(hits) desc limit ?
# hours are cut in UTC like the code does (date_trunc alone uses the database's time zone: India's +5:30 put hits a slot off)
sql.gw.rule-hours-since=select rule_id, date_trunc('hour', minute at time zone 'UTC') at time zone 'UTC' as h, sum(hits) as n \
    from gw_limited_key where minute >= ? group by 1, 2
sql.gw.change.insert-gw-change=insert into gw_change(admin_id, admin_name, action, target, detail, reason) values (?,?,?,?,?,?)
sql.gw.changes=select * from gw_change order by at desc limit ?
sql.gw.purge.delete-gw-traffic-minute=delete from gw_traffic_minute where minute < ?
sql.gw.purge.delete-gw-limited-key=delete from gw_limited_key where minute < ?
sql.gw.purge.delete-gw-ip-rule=delete from gw_ip_rule where expires_at is not null and expires_at < now() - interval '7 days'

# ---------------------------------------------------------------- Database (start-up: makes the gateway database when missing)
sql.gw.db.create-database=CREATE DATABASE {name}

